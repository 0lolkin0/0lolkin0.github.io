<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мультяшный сапёр</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: одна сцена — «небо» с облаками, по центру толстенькая игровая доска как игрушка с обводкой и смещённой тенью */
:root {
  --sky: #8fd3ff;
  --sky-deep: #5fb8f0;
  --ink: #23264a;
  --board: #ffd45c;
  --tile: #7ee08a;
  --tile-hi: #a8f0b0;
  --tile-open: #fff6dc;
  --boom: #ff5a5f;
  --white: #ffffff;
  --display: "Rubik", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --outline: 3px solid var(--ink);
  --shadow: 5px 5px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%) fixed;
  background-color: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
  overflow-x: hidden;
}
.clouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.cloud {
  position: absolute; background: var(--white); border-radius: 999px; opacity: .85;
  animation: drift linear infinite;
}
.cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
.cloud::before { width: 55%; height: 160%; left: 15%; bottom: 20%; }
.cloud::after { width: 40%; height: 130%; right: 12%; bottom: 25%; }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

main { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 760px; margin: 0 auto; }

h1 {
  font-family: var(--display); font-weight: 900; margin: 0;
  font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1; text-align: center; text-wrap: balance;
  color: var(--board);
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  text-shadow: 4px 4px 0 var(--ink);
  transform: rotate(-2deg);
}
.tagline { margin: -4px 0 0; font-weight: 800; text-align: center; }

.levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.btn {
  font-family: var(--display); font-weight: 700; font-size: 1rem;
  color: var(--ink); background: var(--white);
  border: var(--outline); border-radius: 14px; padding: 8px 16px;
  box-shadow: 3px 3px 0 var(--ink); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn[aria-pressed="true"] { background: var(--board); }
.btn:focus-visible, .cell:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }

.board-wrap {
  background: var(--board); border: var(--outline); border-radius: 22px; box-shadow: var(--shadow);
  padding: 12px; display: flex; flex-direction: column; gap: 12px; max-width: 100%;
}
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.counter {
  font-family: var(--display); font-weight: 900; font-size: 1.4rem; font-variant-numeric: tabular-nums;
  background: var(--ink); color: var(--board); border-radius: 12px; padding: 4px 12px; min-width: 4.4em;
  display: flex; align-items: center; gap: 6px; justify-content: center;
}
.counter svg { width: 1.1em; height: 1.1em; }
.face {
  width: 52px; height: 52px; border-radius: 50%; padding: 0;
  background: var(--board); border: var(--outline); box-shadow: 3px 3px 0 var(--ink);
  cursor: pointer; display: grid; place-items: center;
  transition: transform .08s;
}
.face:active { transform: translate(2px, 2px) scale(.95); box-shadow: 0 0 0 var(--ink); }
.face svg { width: 40px; height: 40px; }

.grid {
  --cols: 9;
  --cell: min(38px, calc((100vw - 32px - 30px - (var(--cols) - 1) * 3px) / var(--cols)));
  display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); gap: 3px;
  justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.cell {
  width: var(--cell); height: var(--cell); padding: 0;
  border: 2px solid var(--ink); border-radius: calc(var(--cell) * .28);
  background: var(--tile); box-shadow: inset 0 -4px 0 rgba(35, 38, 74, .25), inset 0 3px 0 var(--tile-hi);
  font-family: var(--display); font-weight: 900; font-size: calc(var(--cell) * .58); line-height: 1;
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
  transition: transform .35s ease-out;
}
.cell.pressing { transform: scale(.8); background: var(--board); }
.cell:hover:not(.open) { background: var(--tile-hi); }
.cell.open { background: var(--tile-open); box-shadow: none; cursor: default; animation: pop .18s ease-out; }
.cell.boom { background: var(--boom); }
.cell.wrong { background: #ffc2c4; }
.cell svg { width: 78%; height: 78%; }
.cell.flag svg { animation: wave .3s ease-out; }
@keyframes pop { 0% { transform: scale(.7); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes wave { 0% { transform: translateY(40%) scale(.4); } 100% { transform: none; } }
.n1 { color: #2f6bff; } .n2 { color: #1f9d3a; } .n3 { color: #ff3b47; } .n4 { color: #7a3cff; }
.n5 { color: #c2185b; } .n6 { color: #00a3a3; } .n7 { color: var(--ink); } .n8 { color: #6b6f8f; }

.langs { display: flex; gap: 6px; align-self: flex-end; }
.langs .btn { font-size: .85rem; padding: 4px 10px; border-radius: 10px; }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center; }
.mode { display: flex; align-items: center; gap: 8px; }
.mode svg { width: 20px; height: 20px; }

.help { max-width: 34rem; text-align: center; font-weight: 600; line-height: 1.5; margin: 0; }
.help b { font-weight: 800; }

.overlay {
  position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
  background: rgba(35, 38, 74, .45);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  background: var(--white); border: var(--outline); border-radius: 24px; box-shadow: var(--shadow);
  padding: 24px 28px; text-align: center; max-width: 340px; animation: bounce .45s cubic-bezier(.3, 1.6, .5, 1);
}
.card h2 { font-family: var(--display); font-weight: 900; font-size: 2rem; margin: 0 0 6px; }
.card p { margin: 0 0 16px; font-weight: 700; }
@keyframes bounce { from { transform: scale(.5) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }

.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translate(-6px, 2px) rotate(-1deg); } 40% { transform: translate(6px, -2px) rotate(1deg); } 60% { transform: translate(-4px, 0); } 80% { transform: translate(4px, 0); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="clouds" aria-hidden="true">
  <div class="cloud" style="top:8%;width:140px;height:40px;animation-duration:70s;animation-delay:-20s"></div>
  <div class="cloud" style="top:30%;width:100px;height:30px;animation-duration:55s;animation-delay:-40s"></div>
  <div class="cloud" style="top:62%;width:170px;height:46px;animation-duration:90s;animation-delay:-10s"></div>
  <div class="cloud" style="top:85%;width:120px;height:34px;animation-duration:65s;animation-delay:-50s"></div>
</div>

<main>
  <div class="langs" role="group" aria-label="Язык" data-i18n-aria="language">
    <button class="btn" id="lang-ru" data-lang="ru" aria-pressed="true">RU</button>
    <button class="btn" id="lang-tr" data-lang="tr" aria-pressed="false">TR</button>
    <button class="btn" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <h1 data-i18n="heading">Сапёр!</h1>
  <p class="tagline" data-i18n="tagline">Найди все бомбочки и не взорвись</p>

  <div class="levels" role="group" aria-label="Сложность" data-i18n-aria="difficulty">
    <button class="btn" id="lvl-easy" data-level="easy" aria-pressed="true" data-i18n="easy">Лёгкий</button>
    <button class="btn" id="lvl-mid" data-level="mid" aria-pressed="false" data-i18n="mid">Средний</button>
    <button class="btn" id="lvl-hard" data-level="hard" aria-pressed="false" data-i18n="hard">Сложный</button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="hud">
      <div class="counter" title="Осталось бомб" data-i18n-title="minesLeft"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="14" r="8" fill="currentColor"/><path d="M15 7 L18 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="19.5" cy="3" r="2" fill="#ff8a3d"/></svg><span id="minesLeft">10</span></div>
      <button class="face" id="face" aria-label="Новая игра" data-i18n-aria="newGame"></button>
      <div class="counter" title="Время" data-i18n-title="time"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 8.5V13l3 2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M9.5 2.5h5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span id="time">0</span></div>
    </div>
    <div class="grid" id="grid" role="grid" aria-label="Игровое поле" data-i18n-aria="board"></div>
  </div>

  <div class="controls">
    <button class="btn mode" id="flagMode" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18" stroke="#23264a" stroke-width="2.5" stroke-linecap="round"/><path d="M7 4l11 4-11 4z" fill="#ff5a5f" stroke="#23264a" stroke-width="2" stroke-linejoin="round"/></svg>
      <span id="flagModeText">Режим флажков: выкл</span>
    </button>
  </div>

  <p class="help" data-i18n-html="help"><b>Нажми</b> на клетку, чтобы открыть её. Цифра показывает, сколько бомб рядом. <b>Правый клик</b> или <b>долгое нажатие</b> ставит флажок, а нажатие на флажок убирает его. Нажми на цифру, вокруг которой уже стоят все флажки, чтобы открыть соседей.</p>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="card">
    <h2 id="resultTitle">Победа!</h2>
    <p id="resultText"></p>
    <button class="btn" id="again" data-i18n="again">Играть ещё</button>
  </div>
</div>

<script>
(function () {
  const LEVELS = {
    easy: { rows: 9, cols: 9, mines: 10 },
    mid:  { rows: 12, cols: 12, mines: 24 },
    hard: { rows: 16, cols: 16, mines: 40 }
  };
  const I18N = {
    ru: {
      docTitle: "Мультяшный сапёр", heading: "Сапёр!", tagline: "Найди все бомбочки и не взорвись",
      language: "Язык", difficulty: "Сложность", easy: "Лёгкий", mid: "Средний", hard: "Сложный",
      minesLeft: "Осталось бомб", time: "Время", newGame: "Новая игра", board: "Игровое поле",
      flagMode: "Режим флажков", on: "вкл", off: "выкл",
      help: "<b>Нажми</b> на клетку, чтобы открыть её. Цифра показывает, сколько бомб рядом. <b>Правый клик</b> или <b>долгое нажатие</b> ставит флажок, а нажатие на флажок убирает его. Нажми на цифру, вокруг которой уже стоят все флажки, чтобы открыть соседей.",
      loseTitle: "Бабах!", loseText: "Ты наступил на бомбочку. Попробуешь ещё раз?",
      winTitle: "Победа!", winText: s => `Все бомбочки найдены за ${s} сек.`, best: b => ` Твой рекорд: ${b} сек.`,
      again: "Играть ещё", closed: "Закрытая клетка", bomb: "Бомба", near: n => n + " рядом", empty: "Пусто", flag: "Флажок"
    },
    tr: {
      docTitle: "Çizgi Film Mayın Tarlası", heading: "Mayın Tarlası!", tagline: "Tüm bombaları bul ve patlama!",
      language: "Dil", difficulty: "Zorluk", easy: "Kolay", mid: "Orta", hard: "Zor",
      minesLeft: "Kalan bomba", time: "Süre", newGame: "Yeni oyun", board: "Oyun alanı",
      flagMode: "Bayrak modu", on: "açık", off: "kapalı",
      help: "Kareyi açmak için <b>dokun</b>. Sayı, yanında kaç bomba olduğunu gösterir. <b>Sağ tık</b> ya da <b>uzun basma</b> bayrak koyar, bayrağa dokunmak onu kaldırır. Etrafındaki tüm bayrakları koyduğun bir sayıya dokunursan komşu kareler açılır.",
      loseTitle: "Bum!", loseText: "Bir bombaya bastın. Tekrar dener misin?",
      winTitle: "Kazandın!", winText: s => `Tüm bombaları ${s} saniyede buldun.`, best: b => ` Rekorun: ${b} sn.`,
      again: "Tekrar oyna", closed: "Kapalı kare", bomb: "Bomba", near: n => "Yanında " + n, empty: "Boş", flag: "Bayrak"
    },
    en: {
      docTitle: "Cartoon Minesweeper", heading: "Minesweeper!", tagline: "Find all the bombs and don't go boom",
      language: "Language", difficulty: "Difficulty", easy: "Easy", mid: "Medium", hard: "Hard",
      minesLeft: "Bombs left", time: "Time", newGame: "New game", board: "Game board",
      flagMode: "Flag mode", on: "on", off: "off",
      help: "<b>Tap</b> a square to open it. A number shows how many bombs are next to it. <b>Right-click</b> or <b>long-press</b> to place a flag, and tap a flag to remove it. Tap a number that already has all its flags around it to open its neighbors.",
      loseTitle: "Kaboom!", loseText: "You stepped on a bomb. Try again?",
      winTitle: "You win!", winText: s => `You found all the bombs in ${s} sec.`, best: b => ` Your best: ${b} sec.`,
      again: "Play again", closed: "Hidden square", bomb: "Bomb", near: n => n + " nearby", empty: "Empty", flag: "Flag"
    }
  };
  let lang = "ru";
  try { const saved = localStorage.getItem("saper-lang"); if (I18N[saved]) lang = saved; } catch (e) {}
  const t = key => I18N[lang][key];

  const INK = "#23264a";
  const SVG = {
    bomb: `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="14" cy="18" r="10" fill="${INK}"/><circle cx="10.5" cy="14.5" r="3" fill="#fff" opacity=".55"/><rect x="18" y="6" width="6" height="5" rx="1.5" transform="rotate(40 21 8.5)" fill="#8a8fb8" stroke="${INK}" stroke-width="1.5"/><path d="M23 6 q2-4 5-3" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/><path d="M28 1.5l1 2.3 2.3.7-2.3.8-1 2.2-.8-2.2-2.3-.8 2.3-.7z" fill="#ff9f1c"/></svg>`,
    flag: `<svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="13" cy="28" rx="8" ry="2.5" fill="${INK}" opacity=".3"/><path d="M10 4v23" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><path d="M11 5l15 6-15 6z" fill="#ff5a5f" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/></svg>`,
    cross: `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 8l16 16M24 8L8 24" stroke="#ff3b47" stroke-width="4" stroke-linecap="round"/></svg>`
  };
  function face(kind) {
    const eyes = kind === "dead"
      ? `<path d="M12 14l5 5M17 14l-5 5M23 14l5 5M28 14l-5 5" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`
      : kind === "cool"
      ? `<path d="M8 15h24" stroke="${INK}" stroke-width="2.5"/><rect x="9" y="14" width="10" height="6" rx="3" fill="${INK}"/><rect x="21" y="14" width="10" height="6" rx="3" fill="${INK}"/>`
      : `<ellipse cx="15" cy="16" rx="2.6" ry="3.4" fill="${INK}"/><ellipse cx="25" cy="16" rx="2.6" ry="3.4" fill="${INK}"/><circle cx="15.8" cy="15" r="1" fill="#fff"/><circle cx="25.8" cy="15" r="1" fill="#fff"/>`;
    const mouth = kind === "dead"
      ? `<path d="M14 29q6-5 12 0" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`
      : kind === "wow"
      ? `<ellipse cx="20" cy="27" rx="3.5" ry="4.2" fill="${INK}"/>`
      : `<path d="M12 24q8 8 16 0" fill="#ff7b7f" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
    return `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="9" cy="23" r="3" fill="#ff9aa2" opacity=".7"/><circle cx="31" cy="23" r="3" fill="#ff9aa2" opacity=".7"/>${eyes}${mouth}</svg>`;
  }

  const gridEl = document.getElementById("grid");
  const minesLeftEl = document.getElementById("minesLeft");
  const timeEl = document.getElementById("time");
  const faceEl = document.getElementById("face");
  const overlay = document.getElementById("overlay");
  const wrap = document.getElementById("boardWrap");
  const flagModeBtn = document.getElementById("flagMode");

  let level = "easy", cfg, cells, els, started, over, flags, opened, timer, seconds, flagMode = false;

  function neighbors(i) {
    const r = Math.floor(i / cfg.cols), c = i % cfg.cols, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < cfg.rows && nc >= 0 && nc < cfg.cols) out.push(nr * cfg.cols + nc);
    }
    return out;
  }

  function newGame() {
    cfg = LEVELS[level];
    const total = cfg.rows * cfg.cols;
    cells = Array.from({ length: total }, () => ({ mine: false, open: false, flag: false, n: 0 }));
    started = false; over = false; flags = 0; opened = 0; seconds = 0;
    clearInterval(timer);
    timeEl.textContent = "0";
    minesLeftEl.textContent = cfg.mines;
    faceEl.innerHTML = face("happy");
    overlay.hidden = true;
    gridEl.style.setProperty("--cols", cfg.cols);
    gridEl.innerHTML = "";
    els = [];
    const frag = document.createDocumentFragment();
    for (let i = 0; i < total; i++) {
      const b = document.createElement("button");
      b.className = "cell";
      b.id = "cell-" + i;
      b.dataset.i = i;
      b.setAttribute("aria-label", t("closed"));
      frag.appendChild(b);
      els.push(b);
    }
    gridEl.appendChild(frag);
  }

  function placeMines(safe) {
    const banned = new Set([safe, ...neighbors(safe)]);
    const pool = [];
    for (let i = 0; i < cells.length; i++) if (!banned.has(i)) pool.push(i);
    for (let k = 0; k < cfg.mines; k++) {
      const j = k + Math.floor(Math.random() * (pool.length - k));
      [pool[k], pool[j]] = [pool[j], pool[k]];
      cells[pool[k]].mine = true;
    }
    cells.forEach((c, i) => { c.n = neighbors(i).filter(j => cells[j].mine).length; });
  }

  function startTimer() {
    started = true;
    timer = setInterval(() => { seconds = Math.min(999, seconds + 1); timeEl.textContent = seconds; }, 1000);
  }

  function render(i) {
    const c = cells[i], el = els[i];
    el.classList.toggle("open", c.open);
    el.classList.toggle("flag", c.flag && !c.open);
    el.className = el.className.replace(/\bn\d\b/g, "").trim();
    if (c.open) {
      if (c.mine) { el.innerHTML = SVG.bomb; el.setAttribute("aria-label", t("bomb")); }
      else if (c.n) { el.textContent = c.n; el.classList.add("n" + c.n); el.setAttribute("aria-label", t("near")(c.n)); }
      else { el.textContent = ""; el.setAttribute("aria-label", t("empty")); }
    } else if (c.flag) { el.innerHTML = SVG.flag; el.setAttribute("aria-label", t("flag")); }
    else { el.textContent = ""; el.setAttribute("aria-label", t("closed")); }
  }

  function open(i) {
    const stack = [i];
    while (stack.length) {
      const k = stack.pop(), c = cells[k];
      if (c.open || c.flag) continue;
      c.open = true; opened++;
      render(k);
      if (c.mine) return lose(k);
      if (c.n === 0) for (const j of neighbors(k)) if (!cells[j].open) stack.push(j);
    }
    if (opened === cells.length - cfg.mines) win();
  }

  function chord(i) {
    const ns = neighbors(i);
    if (ns.filter(j => cells[j].flag).length !== cells[i].n) return;
    for (const j of ns) { if (over) break; if (!cells[j].open && !cells[j].flag) open(j); }
  }

  function toggleFlag(i) {
    const c = cells[i];
    if (over || c.open) return;
    c.flag = !c.flag;
    flags += c.flag ? 1 : -1;
    minesLeftEl.textContent = cfg.mines - flags;
    render(i);
  }

  function act(i) {
    if (over) return;
    const c = cells[i];
    if (flagMode && !c.open) return toggleFlag(i);
    if (c.flag) return toggleFlag(i);
    if (!started) { placeMines(i); startTimer(); }
    if (c.open) { if (c.n) chord(i); return; }
    open(i);
  }

  function lose(k) {
    over = true; clearInterval(timer);
    els[k].classList.add("boom");
    cells.forEach((c, i) => {
      if (c.mine && !c.flag && !c.open) { c.open = true; render(i); }
      if (!c.mine && c.flag) { els[i].classList.add("wrong"); els[i].innerHTML = SVG.cross; }
    });
    faceEl.innerHTML = face("dead");
    wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake");
    setTimeout(() => showResult({ kind: "lose" }), 700);
  }

  function win() {
    over = true; clearInterval(timer);
    cells.forEach((c, i) => { if (c.mine && !c.flag) { c.flag = true; render(i); } });
    minesLeftEl.textContent = 0;
    faceEl.innerHTML = face("cool");
    showResult({ kind: "win", seconds, best: saveBest() });
  }

  function saveBest() {
    try {
      const key = "saper-best-" + level;
      const saved = localStorage.getItem(key);
      const prev = saved === null ? Infinity : Number(saved);
      const best = Math.min(prev, seconds);
      localStorage.setItem(key, best);
      return best;
    } catch (e) { return null; }
  }

  let lastResult = null;
  function fillResult() {
    const res = lastResult; if (!res) return;
    const win = res.kind === "win";
    document.getElementById("resultTitle").textContent = t(win ? "winTitle" : "loseTitle");
    document.getElementById("resultText").textContent = win
      ? t("winText")(res.seconds) + (res.best != null ? t("best")(res.best) : "")
      : t("loseText");
  }
  function showResult(res) {
    lastResult = res;
    fillResult();
    overlay.hidden = false;
    document.getElementById("again").focus();
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t("docTitle");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    updateFlagModeText();
    if (cells) cells.forEach((_, i) => render(i));
    fillResult();
  }
  function updateFlagModeText() {
    document.getElementById("flagModeText").textContent = t("flagMode") + ": " + t(flagMode ? "on" : "off");
  }

  // Мышь: левый клик открывает, правый ставит флажок.
  // Палец: касание обрабатываем сами — короткое нажатие открывает, долгое ставит или убирает флажок.
  // Браузерные жесты на поле отключены, чтобы телефон не отменял долгое нажатие и не показывал меню.
  const LONG_PRESS = 350, MOVE_LIMIT = 15;
  let press = null, lastTouch = 0;
  const resetFace = () => { if (!over) faceEl.innerHTML = face("happy"); };
  function cancelPress() {
    if (!press) return;
    clearTimeout(press.timer);
    press.el.classList.remove("pressing");
    press = null;
    resetFace();
  }
  gridEl.addEventListener("touchstart", e => { if (e.target.closest(".cell")) e.preventDefault(); }, { passive: false });
  gridEl.addEventListener("pointerdown", e => {
    const b = e.target.closest(".cell"); if (!b || over) return;
    if (e.pointerType === "mouse") { if (e.button === 0) faceEl.innerHTML = face("wow"); return; }
    lastTouch = Date.now();
    cancelPress();
    const i = +b.dataset.i;
    const p = { id: e.pointerId, i, el: b, x: e.clientX, y: e.clientY, long: false };
    if (!cells[i].open) b.classList.add("pressing");
    faceEl.innerHTML = face("wow");
    p.timer = setTimeout(() => {
      p.long = true;
      b.classList.remove("pressing");
      toggleFlag(i);
      if (navigator.vibrate) try { navigator.vibrate(30); } catch (_) {}
    }, LONG_PRESS);
    press = p;
  });
  gridEl.addEventListener("pointermove", e => {
    if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > MOVE_LIMIT) cancelPress();
  });
  gridEl.addEventListener("pointerup", e => {
    if (e.pointerType === "mouse") return resetFace();
    lastTouch = Date.now();
    if (!press || e.pointerId !== press.id) return;
    const p = press;
    cancelPress();
    if (!p.long) act(p.i);
  });
  gridEl.addEventListener("pointercancel", cancelPress);
  gridEl.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") resetFace(); });
  const fromTouch = () => Date.now() - lastTouch < 800;
  gridEl.addEventListener("click", e => {
    const b = e.target.closest(".cell"); if (!b || fromTouch()) return;
    act(+b.dataset.i);
  });
  gridEl.addEventListener("contextmenu", e => {
    const b = e.target.closest(".cell"); if (!b) return;
    e.preventDefault();
    if (!fromTouch()) toggleFlag(+b.dataset.i);
  });

  faceEl.addEventListener("click", newGame);
  document.getElementById("again").addEventListener("click", newGame);
  flagModeBtn.addEventListener("click", () => {
    flagMode = !flagMode;
    flagModeBtn.setAttribute("aria-pressed", flagMode);
    updateFlagModeText();
  });
  document.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => {
    level = b.dataset.level;
    document.querySelectorAll("[data-level]").forEach(x => x.setAttribute("aria-pressed", x === b));
    newGame();
  }));

  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("saper-lang", lang); } catch (e) {}
    applyLang();
  }));

  newGame();
  applyLang();
})();
</script>
</body>
</html>
