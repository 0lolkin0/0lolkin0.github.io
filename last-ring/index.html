<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Последнее кольцо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: полноэкранный canvas с картой, поверх — HUD (DOM) и мультяшные карточки меню/паузы/итогов */
:root {
  --ink: #23264a;
  --grass: #7cc36a;
  --sun: #ffd45c;
  --red: #ff5a5f;
  --blue: #5fb8f0;
  --white: #ffffff;
  --display: "Rubik", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --outline: 3px solid var(--ink);
  --shadow: 5px 5px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #4f8f45; color: var(--ink); font-family: var(--body); }
body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
canvas#game { position: fixed; inset: 0; display: block; touch-action: none; cursor: crosshair; }

.btn {
  font-family: var(--display); font-weight: 700; font-size: 1rem;
  color: var(--ink); background: var(--white);
  border: var(--outline); border-radius: 14px; padding: 8px 16px;
  box-shadow: 3px 3px 0 var(--ink); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn[aria-pressed="true"] { background: var(--sun); }
.btn:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
.btn.big { font-size: 1.35rem; padding: 12px 28px; background: var(--red); color: var(--white); text-shadow: 2px 2px 0 var(--ink); }

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 10; display: flex; overflow-y: auto;
  background: rgba(35, 38, 74, .35);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
}
.card {
  background: var(--white); border: var(--outline); border-radius: 24px; box-shadow: var(--shadow);
  padding: 22px 24px; text-align: center; width: min(460px, 100%); margin: auto;
  display: flex; flex-direction: column; gap: 14px; align-items: center;
  animation: bounce .45s cubic-bezier(.3, 1.6, .5, 1);
}
@keyframes bounce { from { transform: scale(.5) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
h1 {
  font-family: var(--display); font-weight: 900; margin: 0;
  font-size: clamp(2.1rem, 9vw, 3.2rem); line-height: 1; text-wrap: balance;
  color: var(--sun); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  text-shadow: 4px 4px 0 var(--ink); transform: rotate(-2deg);
}
.card h2 { font-family: var(--display); font-weight: 900; font-size: 2rem; margin: 0; }
.tagline { margin: -4px 0 0; font-weight: 800; }
.langs { display: flex; gap: 6px; align-self: flex-end; }
.langs .btn { font-size: .8rem; padding: 3px 9px; border-radius: 10px; }
.label { font-family: var(--display); font-weight: 700; margin: 0; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.row .btn { font-size: .9rem; padding: 6px 12px; }
.desc { margin: -6px 0 0; font-weight: 600; font-size: .92rem; min-height: 2.6em; line-height: 1.3; }
.slider { display: flex; align-items: center; gap: 10px; width: 100%; font-weight: 800; }
.slider input { flex: 1; accent-color: var(--red); }
.slider output { font-family: var(--display); min-width: 2ch; }
.help { margin: 0; font-size: .85rem; font-weight: 600; line-height: 1.45; color: #4a4e75; }
.help b { color: var(--ink); }
.best { margin: 0; font-weight: 800; font-size: .9rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.stat { background: #f4f1e6; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 4px; }
.stat b { display: block; font-family: var(--display); font-size: 1.5rem; }
.stat span { font-size: .78rem; font-weight: 800; }
.back { font-size: .85rem; font-weight: 800; color: var(--ink); }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; font-family: var(--display); }
#hud button { pointer-events: auto; }
.pill {
  background: rgba(35, 38, 74, .78); color: var(--white); border-radius: 12px;
  padding: 4px 10px; font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums;
}
.tl { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.tl .line { display: flex; gap: 6px; }
#zoneMsg { font-size: .85rem; }
#zoneMsg.warn { background: rgba(200, 30, 40, .85); }
#mini {
  position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  width: 150px; height: 150px; border: 3px solid var(--ink); border-radius: 14px; background: #4f8f45;
}
#pauseBtn { position: absolute; top: calc(max(10px, env(safe-area-inset-top, 0px)) + 160px); right: max(10px, env(safe-area-inset-right, 0px)); padding: 4px 12px; font-size: .9rem; }
#feed { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; align-items: center; width: min(420px, 50vw); }
#feed .pill { font-family: var(--body); font-weight: 800; font-size: .82rem; text-align: center; animation: fadein .2s; }
#feed .me { color: var(--sun); }
@keyframes fadein { from { opacity: 0; transform: translateY(-6px); } }
.bottom {
  position: absolute; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center; align-items: flex-end; gap: 14px; padding: 0 10px; flex-wrap: wrap;
}
.vitals { display: flex; flex-direction: column; align-items: center; gap: 4px; width: min(340px, 80vw); }
#ammoBig { color: var(--white); font-weight: 900; font-size: 1.6rem; text-shadow: 2px 2px 0 var(--ink); font-variant-numeric: tabular-nums; }
#ammoBig small { font-size: .9rem; opacity: .9; }
.bar { width: 100%; height: 14px; background: rgba(35, 38, 74, .7); border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.bar.boost { height: 7px; border-width: 1.5px; }
.bar i { display: block; height: 100%; width: 100%; background: #fff; transition: width .15s; }
.bar.boost i { background: #ffb33d; }
.bar.low i { background: var(--red); }
.slots, .items { display: flex; gap: 6px; }
.slot, .item {
  background: rgba(35, 38, 74, .72); color: var(--white); border: 2px solid var(--ink); border-radius: 12px;
  padding: 4px 8px; font-family: var(--display); font-weight: 700; font-size: .8rem; text-align: left;
  min-width: 64px; cursor: pointer; line-height: 1.15;
}
.slot small, .item small { display: block; font-size: .7rem; opacity: .75; font-weight: 500; }
.slot.on { background: var(--sun); color: var(--ink); }
.slot.empty { opacity: .45; }
.item { min-width: 54px; text-align: center; }
.item.zero { opacity: .4; }
.item.using { background: #ffb33d; color: var(--ink); }
#prompt { position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%); font-weight: 700; }
#vignette { position: absolute; inset: 0; box-shadow: inset 0 0 120px 30px rgba(255, 30, 40, .55); opacity: 0; transition: opacity .25s; }
.touchbtns { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 190px; display: none; flex-direction: column; gap: 10px; }
.touchbtns .btn { pointer-events: auto; font-size: .85rem; padding: 8px 12px; }
body.touch .touchbtns { display: flex; }
body.touch #prompt { bottom: auto; top: 46%; }
body.touch .bottom { justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px; }
body.touch .slots, body.touch .items { gap: 4px; }
body.touch .slot, body.touch .item { min-width: 0; padding: 3px 7px; font-size: .72rem; }
body.touch .item small { display: none; }
body.touch #ammoBig { font-size: 1.2rem; }
body.touch .vitals { order: -1; width: 100%; }
body.touch #mini { width: 110px; height: 110px; }
body.touch #pauseBtn { top: calc(max(10px, env(safe-area-inset-top, 0px)) + 120px); }
@media (max-width: 640px) {
  .slot, .item { min-width: 0; font-size: .72rem; padding: 3px 6px; }
  #feed { top: calc(max(10px, env(safe-area-inset-top, 0px)) + 64px); left: 10px; transform: none; align-items: flex-start; width: 60vw; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div id="vignette"></div>
  <div class="tl">
    <div class="line"><div class="pill" id="aliveTxt"></div><div class="pill" id="killsTxt"></div></div>
    <div class="pill" id="zoneMsg"></div>
  </div>
  <div id="feed" aria-live="polite"></div>
  <canvas id="mini" width="150" height="150"></canvas>
  <button class="btn" id="pauseBtn" aria-label="Пауза" data-i18n-aria="pause">II</button>
  <div class="pill" id="prompt" hidden></div>
  <div class="touchbtns">
    <button class="btn" id="tPick" hidden></button>
    <button class="btn" id="tReload" data-i18n="reload">Перезарядка</button>
    <button class="btn" id="tSwap" data-i18n="swap">Сменить</button>
  </div>
  <div class="bottom">
    <div class="items" id="items"></div>
    <div class="vitals">
      <div id="ammoBig"></div>
      <div class="bar boost"><i id="boostFill"></i></div>
      <div class="bar" id="hpBar"><i id="hpFill"></i></div>
    </div>
    <div class="slots" id="slots"></div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <div class="langs" role="group" aria-label="Язык" data-i18n-aria="language">
      <button class="btn" data-lang="ru" aria-pressed="true">RU</button>
      <button class="btn" data-lang="tr" aria-pressed="false">TR</button>
      <button class="btn" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <h1 data-i18n="title">Последнее кольцо</h1>
    <p class="tagline" data-i18n="tagline">Собирай лут, прячься в кустах и останься последним в сужающемся кольце</p>
    <p class="label" data-i18n="difficulty">Сложность ботов</p>
    <div class="row" id="diffs" role="group"></div>
    <p class="desc" id="diffDesc"></p>
    <label class="slider"><span data-i18n="bots">Ботов</span><input type="range" id="botCount" min="3" max="40" step="1" value="20"><output id="botOut">20</output></label>
    <button class="btn big" id="playBtn" data-i18n="play">Играть!</button>
    <p class="best" id="bestTxt"></p>
    <p class="help" id="helpTxt"></p>
    <a class="back" href="../" data-i18n="back">← К сапёру</a>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="card">
    <h2 data-i18n="paused">Пауза</h2>
    <button class="btn big" id="resumeBtn" data-i18n="resume">Продолжить</button>
    <button class="btn" id="quitBtn" data-i18n="toMenu">В меню</button>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <h2 id="endTitle"></h2>
    <p class="tagline" id="endSub"></p>
    <div class="stats">
      <div class="stat"><b id="sPlace"></b><span data-i18n="place">Место</span></div>
      <div class="stat"><b id="sKills"></b><span data-i18n="killsW">Убийства</span></div>
      <div class="stat"><b id="sTime"></b><span data-i18n="timeW">Время</span></div>
    </div>
    <button class="btn big" id="againBtn" data-i18n="again">Ещё раз</button>
    <button class="btn" id="endMenuBtn" data-i18n="toMenu">В меню</button>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   Последнее кольцо — 2D королевская битва с ботами.
   Полностью собственный код: карта, лут, сужающаяся зона, ИИ ботов.
   ===================================================================== */

/* ---------- i18n ---------- */
const I18N = {

    place: "Место", killsW: "Убийства", timeW: "Время", again: "Ещё раз",
    win: "Победа!", winSub: "Ты последний выживший 🏆", lose: "Ты выбыл", loseBy: "Тебя победил {n}", loseZone: "Тебя накрыла зона",
    loseBoom: "Взрыв бочки", pick: "[E] Подобрать: {n}", pickT: "Взять: {n}", reload: "Перезарядка", swap: "Сменить", reloading: "Перезарядка…",
    you: "Ты", zone: "зона", boom: "взрыв",
    fists: "Кулаки", pistol: "Пистолет", smg: "Пистолет-пулемёт", shotgun: "Дробовик", rifle: "Автомат", sniper: "Снайперка",
    a9: "Патроны 9 мм", a12: "Дробь", a762: "Патроны 7.62", bandage: "Бинт", medkit: "Аптечка", soda: "Энергетик", vest: "Бронежилет {n} ур.",
    empty: "пусто"
  },
  tr: {
    title: "Son Halka", tagline: "Ganimet topla, çalılarda saklan ve daralan halkada hayatta kalan son kişi ol",
    difficulty: "Bot zorluğu", bots: "Bot", play: "Oyna!", language: "Dil", back: "← Mayın tarlasına",
    easy: "Acemi", normal: "Asker", hard: "Usta", insane: "Terminatör", mixed: "Karışık",
    easyD: "Yavaş tepki verir, ıskalar, bölgeyi pek takip etmez.",
    normalD: "Kaçar, siperde şarjör değiştirir, iyileşir.",
    hardD: "Hızlı tepki, önden nişan alır, mesafeye göre silah seçer.",
    insaneD: "Neredeyse hiç ıskalamaz ve seni avlar. Bol şans!",
    mixedD: "Her botun kendi seviyesi var — acemiden terminatöre.",
    helpPc: "<b>WASD</b> — koş · <b>fare</b> — nişan · <b>sol tık</b> — ateş · <b>R</b> — şarjör · <b>E</b> — al · <b>1/2/3</b>, tekerlek — silah · <b>4/5/6</b> — bandaj/ilk yardım/enerji · <b>Esc</b> — duraklat",
    helpTouch: "<b>Sol çubuk</b> — koş · <b>sağ çubuk</b> — nişan ve ateş · sağdaki düğmeler — al, şarjör, silah değiştir · altta — iyileşme",

    zoneWait: "Bölge {t} sonra daralacak", zoneShrink: "Bölge daralıyor!", zoneFinal: "Son halka",
    outside: "Bölgenin dışındasın! Halkaya koş", pause: "Duraklat", paused: "Duraklatıldı", resume: "Devam", toMenu: "Menü",
    place: "Sıra", killsW: "Leş", timeW: "Süre", again: "Tekrar",
    win: "Zafer!", winSub: "Hayatta kalan son kişi sensin 🏆", lose: "Elendin", loseBy: "Seni {n} yendi", loseZone: "Bölge seni yakaladı",
    loseBoom: "Varil patlaması", pick: "[E] Al: {n}", pickT: "Al: {n}", reload: "Şarjör", swap: "Değiştir", reloading: "Şarjör değişiyor…",
    you: "Sen", zone: "bölge", boom: "patlama",
    fists: "Yumruk", pistol: "Tabanca", smg: "Hafif makineli", shotgun: "Pompalı", rifle: "Tüfek", sniper: "Keskin nişancı",
    a9: "9 mm mermi", a12: "Saçma", a762: "7.62 mermi", bandage: "Bandaj", medkit: "İlk yardım", soda: "Enerji içeceği", vest: "Yelek sv. {n}",
    empty: "boş"
  },
  en: {
    title: "Last Ring", tagline: "Grab loot, hide in bushes and be the last one standing inside the shrinking ring",
    difficulty: "Bot difficulty", bots: "Bots", play: "Play!", language: "Language", back: "← To Minesweeper",
    easy: "Rookie", normal: "Soldier", hard: "Veteran", insane: "Terminator", mixed: "Mixed",
    easyD: "Slow to react, miss a lot, barely watch the zone.",

    helpTouch: "<b>Left stick</b> — move · <b>right stick</b> — aim and shoot · right buttons — pick up, reload, swap · bottom — healing",
    best: "Best result: #{p} place, {k} kills", alive: "Alive: {n}", kills: "Kills: {n}",
    zoneWait: "Zone shrinks in {t}", zoneShrink: "Zone is shrinking!", zoneFinal: "Final ring",
    outside: "You're outside the zone! Run to the ring", pause: "Pause", paused: "Paused", resume: "Resume", toMenu: "Menu",

    win: "Victory!", winSub: "You are the last survivor 🏆", lose: "You're out", loseBy: "Taken down by {n}", loseZone: "The zone got you",

    a9: "9mm ammo", a12: "Shells", a762: "7.62 ammo", bandage: "Bandage", medkit: "Medkit", soda: "Soda", vest: "Vest lvl {n}",
    empty: "empty"
  }
};
let lang = "ru";
try {
  const saved = localStorage.getItem("lastring-lang") || localStorage.getItem("saper-lang");
  if (I18N[saved]) lang = saved;
} catch (e) {}
const t = (key, vars) => {
  let s = I18N[lang][key] ?? key;
  if (vars) for (const k in vars) s = s.replace("{" + k + "}", vars[k]);
  return s;
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const turnToward = (a, b, max) => { const d = angDiff(a, b); return Math.abs(d) <= max ? b : a + Math.sign(d) * max; };
function weighted(table) {
  let sum = 0; for (const k in table) sum += table[k];
  let r = Math.random() * sum;
  for (const k in table) { r -= table[k]; if (r <= 0) return k; }
  return Object.keys(table)[0];
}
const fmtTime = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* ---------- game data ---------- */

/* ---------- spatial grid for obstacles ---------- */
const CELL = 200, GW = Math.ceil(MAP / CELL);
let grid = [], stamp = 0;
const qbuf = [];
function obsBounds(o) { return o.shape === "c" ? [o.x - o.r, o.y - o.r, o.x + o.r, o.y + o.r] : [o.x - o.hw, o.y - o.hh, o.x + o.hw, o.y + o.hh]; }
function gridInsert(o) {
  const [x0, y0, x1, y1] = obsBounds(o);
  for (let cy = clamp(Math.floor(y0 / CELL), 0, GW - 1); cy <= clamp(Math.floor(y1 / CELL), 0, GW - 1); cy++)
    for (let cx = clamp(Math.floor(x0 / CELL), 0, GW - 1); cx <= clamp(Math.floor(x1 / CELL), 0, GW - 1); cx++)
      grid[cy * GW + cx].push(o);
}
function query(x0, y0, x1, y1, out = qbuf) {

  const cx0 = clamp(Math.floor(x0 / CELL), 0, GW - 1), cx1 = clamp(Math.floor(x1 / CELL), 0, GW - 1);
  const cy0 = clamp(Math.floor(y0 / CELL), 0, GW - 1), cy1 = clamp(Math.floor(y1 / CELL), 0, GW - 1);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    for (const o of grid[cy * GW + cx]) if (o._s !== stamp) { o._s = stamp; if (!o.dead) out.push(o); }
  }

}

/* ---------- geometry ---------- */
function segCircle(x0, y0, dx, dy, len, cx, cy, r) {

  else { let a = (o.x - o.hw - x0) / dx, b = (o.x + o.hw - x0) / dx; if (a > b) [a, b] = [b, a]; tmin = Math.max(tmin, a); tmax = Math.min(tmax, b); if (tmin > tmax) return -1; }

}
function segObs(x0, y0, dx, dy, len, o) { return o.shape === "c" ? segCircle(x0, y0, dx, dy, len, o.x, o.y, o.r) : segRect(x0, y0, dx, dy, len, o); }

}

}

/* ---------- world generation ---------- */
function freeSpot(r, tries = 60, extra) {
  for (let i = 0; i < tries; i++) {
    const x = rand(r + 40, MAP - r - 40), y = rand(r + 40, MAP - r - 40);
    if (blocked(x, y, r + 12)) continue;
    if (extra && !extra(x, y)) continue;
    return { x, y };

  return null;
}
function addObs(o) { o.maxHp = o.hp; G.obs.push(o); gridInsert(o); return o; }
function addWall(x, y, w, h) { return addObs({ kind: "wall", shape: "r", x, y, hw: w / 2, hh: h / 2, hp: Infinity }); }
function makeRuin(cx, cy) {
  const s = rand(150, 230), th = 22, gap = 80;
  const type = randi(0, 2);
  // a small ruined house: four walls with doorways
  if (type === 0) {
    addWall(cx - s / 2 - gap / 4, cy - s / 2, s - gap / 2, th);
    addWall(cx, cy + s / 2, s, th);
    addWall(cx - s / 2, cy + gap / 2 - 10, th, s - gap);
    addWall(cx + s / 2, cy, th, s);
  } else if (type === 1) {
    addWall(cx, cy - s / 2, s, th);
    addWall(cx - s / 2, cy, th, s);
    addWall(cx + s / 4, cy + s / 2, s / 2, th);
  } else {
    addWall(cx - s / 3, cy, th, s * 1.2);
    addWall(cx + s / 3, cy, th, s * 1.2);
    addWall(cx, cy - s * .6, s * .5, th);
  }
  // loot inside ruins
  spawnLootAt(cx + rand(-20, 20), cy + rand(-20, 20), true);
  if (Math.random() < .6) addObs({ kind: "crate", shape: "r", x: cx + rand(-30, 30), y: cy + rand(-30, 30) + 50, hw: 30, hh: 30, hp: 80 });
}
function genWorld() {
  grid = Array.from({ length: GW * GW }, () => []);
  for (let i = 0; i < 20; i++) { const s = freeSpot(170); if (s) makeRuin(s.x, s.y); }
  for (let i = 0; i < 230; i++) { const s = freeSpot(30); if (s) { const tr = addObs({ kind: "tree", shape: "c", x: s.x, y: s.y, r: 26, hp: Infinity, canopy: rand(85, 110), hue: rand(-12, 12) }); G.trees.push(tr); } }
  for (let i = 0; i < 105; i++) { const s = freeSpot(55); if (s) addObs({ kind: "rock", shape: "c", x: s.x, y: s.y, r: rand(38, 55), hp: 170 }); }
  for (let i = 0; i < 145; i++) { const s = freeSpot(36); if (s) addObs({ kind: "crate", shape: "r", x: s.x, y: s.y, hw: 32, hh: 32, hp: 80 }); }
  for (let i = 0; i < 42; i++) { const s = freeSpot(28); if (s) addObs({ kind: "barrel", shape: "c", x: s.x, y: s.y, r: 26, hp: 40 }); }
  for (let i = 0; i < 145; i++) { const s = freeSpot(20); if (s) G.bushes.push({ x: s.x, y: s.y, r: rand(50, 68), seed: Math.random() * 10 }); }
  for (let i = 0; i < 260; i++) { const s = freeSpot(22); if (s) spawnLootAt(s.x, s.y, false); }
  buildMinimapBase();
}

/* ---------- loot ---------- */
function addLoot(x, y, kind, type, amount, extra) {
  const l = { id: nextId++, x: clamp(x, 30, MAP - 30), y: clamp(y, 30, MAP - 30), kind, type, amount, r: kind === "gun" ? 24 : 18, bob: Math.random() * 6 };
  if (extra) Object.assign(l, extra);
  G.loot.push(l);
  return l;
}
function spawnLootAt(x, y, rich) {
  const k = weighted(rich ? { gun: 5, ammo: 2, heal: 3, vest: 2 } : { gun: 3, ammo: 4, heal: 4, vest: 1.3 });
  const sc = () => [x + rand(-30, 30), y + rand(-30, 30)];
  if (k === "gun") {
    const type = weighted(rich ? { pistol: 6, smg: 12, shotgun: 10, rifle: 11, sniper: 5 } : { pistol: 20, smg: 14, shotgun: 12, rifle: 8, sniper: 3 });
    addLoot(x, y, "gun", type, 1, { mag: WEAPONS[type].mag });
    const a = WEAPONS[type].ammo;
    addLoot(...sc(), "ammo", a, AMMO_PACK[a] * (type === "shotgun" ? 1 : 1));
  } else if (k === "ammo") {
    const a = weighted({ a9: 5, a12: 3, a762: 4 });
    addLoot(x, y, "ammo", a, AMMO_PACK[a]);
  } else if (k === "heal") {
    addLoot(x, y, "heal", weighted({ bandage: 25, medkit: 6, soda: 10 }), 1);
  } else {
    addLoot(x, y, "vest", weighted(rich ? { 1: 4, 2: 4, 3: 1.5 } : { 1: 8, 2: 4, 3: 1.2 }), 1);
  }
}
function lootName(l) {
  if (l.kind === "gun") return t(l.type);
  if (l.kind === "ammo") return t(l.type) + " ×" + l.amount;
  if (l.kind === "heal") return t(l.type);
  return t("vest", { n: l.type });
}
function lootValue(p, l) {
  if (l.kind === "gun") {
    if (p.slots.some(g => g && g.type === l.type)) return 0;
    const guns = p.slots.filter(Boolean);
    if (!guns.length) return 10;
    if (guns.length < 2) return 6;
    const worst = Math.min(...guns.map(g => WEAPONS[g.type].tier));
    return WEAPONS[l.type].tier > worst ? 4 : 0;
  }
  if (l.kind === "ammo") return p.slots.some(g => g && WEAPONS[g.type].ammo === l.type) && p.ammo[l.type] < AMMO_CAP[l.type] * .8 ? 3 : 0;
  if (l.kind === "heal") return p.items[l.type] < ITEMS[l.type].cap ? (l.type === "medkit" ? 3 : 2) : 0;

}
function removeLoot(l) { const i = G.loot.indexOf(l); if (i >= 0) G.loot.splice(i, 1); }

  if (l.kind === "gun") {
    let slot = p.slots[0] ? (p.slots[1] ? -1 : 1) : 0;
    if (slot < 0) {
      if (p.isBot) slot = WEAPONS[p.slots[0].type].tier <= WEAPONS[p.slots[1].type].tier ? 0 : 1;
      else slot = p.cur === 2 ? 0 : p.cur;
      const old = p.slots[slot];
      addLoot(p.x + rand(-20, 20), p.y + rand(-20, 20), "gun", old.type, 1, { mag: old.mag });
    }
    p.slots[slot] = { type: l.type, mag: l.mag };
    removeLoot(l);
    switchWeapon(p, slot, true);
  } else if (l.kind === "ammo") {
    const take = Math.min(l.amount, AMMO_CAP[l.type] - p.ammo[l.type]);
    if (take <= 0) return false;
    p.ammo[l.type] += take; l.amount -= take;
    if (l.amount <= 0) removeLoot(l);
  } else if (l.kind === "heal") {
    if (p.items[l.type] >= ITEMS[l.type].cap) return false;
    p.items[l.type]++; removeLoot(l);
  } else {
    if (+l.type <= p.vest) return false;
    if (p.vest) addLoot(p.x + rand(-20, 20), p.y + rand(-20, 20), "vest", String(p.vest), 1);
    p.vest = +l.type; removeLoot(l);

  const spill = (kind, type, amount, extra) => { const a = Math.random() * Math.PI * 2, d = rand(15, 60); addLoot(p.x + Math.cos(a) * d, p.y + Math.sin(a) * d, kind, type, amount, extra); };
  for (const g of p.slots) if (g) spill("gun", g.type, 1, { mag: g.mag });
  for (const a in p.ammo) if (p.ammo[a] > 0) spill("ammo", a, p.ammo[a]);
  for (const it in p.items) for (let i = 0; i < p.items[it]; i++) spill("heal", it, 1);
  if (p.vest) spill("vest", String(p.vest), 1);
}

/* ---------- players ---------- */
function makePlayer(name, isBot, x, y, skill) {
  return {
    pl: true, id: nextId++, name, isBot, x, y, vx: 0, vy: 0, r: 24, hp: 100, boost: 0, angle: rand(0, 6.28),
    slots: [null, null], cur: 2, prevCur: 2, ammo: { a9: 0, a12: 0, a762: 0 }, items: { bandage: 0, medkit: 0, soda: 0 }, vest: 0,
    alive: true, kills: 0, dmgDealt: 0, reloadT: 0, fireT: 0, heal: null, color: pick(SHIRTS), mx: 0, my: 0,
    firing: false, lastShotT: -9, inBush: false, hitT: -9, meleeAnim: 0, punchSide: 0, skill, killer: null,
    ai: isBot ? newAI() : null

}
const curWeapon = p => p.cur === 2 || !p.slots[p.cur] ? "fists" : p.slots[p.cur].type;
const curGun = p => p.cur === 2 ? null : p.slots[p.cur];
function switchWeapon(p, i, force) {
  if (i !== 2 && !p.slots[i]) return;

  if (i !== p.cur) p.prevCur = p.cur;
  p.cur = i; p.reloadT = 0;
  p.fireT = Math.max(p.fireT, .25);
}
function startReload(p) {
  const g = curGun(p); if (!g || p.reloadT > 0) return;
  const w = WEAPONS[g.type];
  if (g.mag >= w.mag || p.ammo[w.ammo] <= 0) return;
  p.reloadT = w.reload; p.heal = null;
}
function startHeal(p, type) {
  if (p.heal || p.items[type] <= 0) return false;
  if (type === "bandage" && p.hp >= 75) return false;
  if (type === "medkit" && p.hp >= 100) return false;
  if (type === "soda" && p.boost >= 100) return false;
  p.heal = { type, t: ITEMS[type].time, total: ITEMS[type].time }; p.reloadT = 0;
  return true;
}
function tryFire(p) {
  if (p.fireT > 0) return;
  const wk = curWeapon(p), w = WEAPONS[wk];
  if (p.heal) p.heal = null;
  if (w.melee) { doMelee(p); p.fireT = w.rate; return; }
  const g = curGun(p);
  if (p.reloadT > 0) return;
  if (g.mag <= 0) { startReload(p); return; }
  g.mag--; p.fireT = w.rate; p.lastShotT = G.time;
  const moving = Math.hypot(p.vx, p.vy) > 60;
  for (let i = 0; i < w.pellets; i++) {
    const a = p.angle + gauss() * w.spread * (moving ? 1.35 : 1) * .6;
    G.bullets.push({ x: p.x, y: p.y, dx: Math.cos(a), dy: Math.sin(a), speed: w.speed * rand(.93, 1.05), dist: 0, max: w.range * rand(.9, 1.05), dmg: w.dmg, owner: p, wk, skip: p.r + w.len });
  }
  const mx = p.x + Math.cos(p.angle) * (p.r + w.len + 8), my = p.y + Math.sin(p.angle) * (p.r + w.len + 8);
  particle(mx, my, 0, 0, .06, "#fff2a8", wk === "shotgun" || wk === "sniper" ? 22 : 15, "flash");
  sfx(w.sfx, p.x, p.y);
}
function doMelee(p) {
  p.meleeAnim = .25; p.punchSide ^= 1;
  sfx("punch", p.x, p.y);
  const ca = Math.cos(p.angle), sa = Math.sin(p.angle);
  for (const o of G.players) {
    if (o === p || !o.alive) continue;
    const dx = o.x - p.x, dy = o.y - p.y, d = Math.hypot(dx, dy);
    if (d < p.r + o.r + WEAPONS.fists.reach && Math.abs(angDiff(p.angle, Math.atan2(dy, dx))) < .9) {
      damagePlayer(o, WEAPONS.fists.dmg, p, "fists");
      particle(o.x - dx / d * o.r, o.y - dy / d * o.r, 0, 0, .15, "#ff4d4d", 10, "spark");
      return;
    }
  }
  const hx = p.x + ca * (p.r + 22), hy = p.y + sa * (p.r + 22);
  for (const o of query(hx - 26, hy - 26, hx + 26, hy + 26)) {
    if (o.hp !== Infinity && overlapsObs(hx, hy, 24, o)) { damageObs(o, WEAPONS.fists.dmg, p); return; }

function damagePlayer(tg, amt, src, wk) {
  if (!tg.alive) return;

/* ---------- human input ---------- */

    if (l.kind !== "gun") continue;

  if (keys.has("KeyS") || keys.has("ArrowDown")) my += 1;
  if (keys.has("KeyA") || keys.has("ArrowLeft")) mx -= 1;
  if (keys.has("KeyD") || keys.has("ArrowRight")) mx += 1;

  for (let i = G.loot.length - 1; i >= 0; i--) {

    if (Math.abs(l.x - p.x) > 60 || Math.abs(l.y - p.y) > 60) continue;
    if (Math.hypot(l.x - p.x, l.y - p.y) > p.r + l.r + 6) continue;
    if (l.kind === "gun") { if (isTouch && (!p.slots[0] || !p.slots[1]) && lootValue(p, l) > 0) pickupLoot(p, l); }
    else pickupLoot(p, l);

}

    time: 0, me: null, over: false, attract, flash: 0, cam: { x: MAP / 2, y: MAP / 2 }, restartT: 0, spectate: null };

    G.me.color = "#ffd45c";

    G.players.push(makePlayer(names[i % names.length] + (i >= names.length ? i : ""), true, s.x, s.y, makeSkill(lvl)));

/* ---------- main update ---------- */
let paused = false;
function update(dt) {
  G.time += dt;
  updateZone(dt);
  for (const p of G.players) {
    if (!p.alive) continue;
    if (p.isBot) botUpdate(p, dt); else humanInput(p, dt);
    updatePlayer(p, dt);
  }
  separatePlayers();
  updateBullets(dt);
  G.flash = Math.max(0, G.flash - dt);
  // camera
  let follow = G.me && G.me.alive ? G.me : G.spectate;
  if ((!follow || !follow.alive) && (G.attract || G.over)) {
    if (G.me && G.me.killer && G.me.killer.alive) follow = G.me.killer;
    else follow = G.players.find(p => p.alive) || null;
    G.spectate = follow;
  }
  if (follow) { const k = Math.min(1, dt * 8); G.cam.x += (follow.x - G.cam.x) * k; G.cam.y += (follow.y - G.cam.y) * k; }

    mctx.beginPath(); mctx.arc(f.x * k, f.y * k, 4 * DPR, 0, 7); mctx.fill(); mctx.stroke();
    mctx.strokeStyle = "rgba(255,255,255,.6)"; mctx.lineWidth = DPR;
    const vw = VW / scale * k, vh = VH / scale * k; mctx.strokeRect(f.x * k - vw / 2, f.y * k - vh / 2, vw, vh);
  }
}

/* ---------- HUD ---------- */
const hudCache = {};
function setText(id, s) { if (hudCache[id] !== s) { hudCache[id] = s; $(id).textContent = s; } }
function setHTML(id, s) { if (hudCache[id] !== s) { hudCache[id] = s; $(id).innerHTML = s; } }
function buildHudButtons() {
  const slots = $("slots"); slots.innerHTML = "";
  for (const i of [0, 1, 2]) {
    const b = document.createElement("button"); b.className = "slot"; b.id = "slot" + i;
    b.addEventListener("pointerdown", e => { e.stopPropagation(); if (G.me && G.me.alive) switchWeapon(G.me, i); });
    slots.appendChild(b);
  }
  const items = $("items"); items.innerHTML = "";
  for (const it of ["bandage", "medkit", "soda"]) {
    const b = document.createElement("button"); b.className = "item"; b.id = "item-" + it; b.title = t(it);
    b.addEventListener("pointerdown", e => { e.stopPropagation(); if (G.me && G.me.alive) startHeal(G.me, it); });
    items.appendChild(b);
  }
  for (const k in hudCache) delete hudCache[k];
}
function updateHUD() {
  if ($("hud").hidden) return;
  const me = G.me, z = G.zone;
  const alive = G.players.filter(p => p.alive).length;
  setText("aliveTxt", t("alive", { n: alive }));
  setText("killsTxt", t("kills", { n: me.kills }));
  const outside = me.alive && Math.hypot(me.x - z.x, me.y - z.y) > z.r;
  setText("zoneMsg", outside ? t("outside") : z.stage === "wait" ? t("zoneWait", { t: fmtTime(z.t) }) : z.stage === "shrink" ? t("zoneShrink") : t("zoneFinal"));
  $("zoneMsg").classList.toggle("warn", outside || z.stage === "shrink");
  $("hpFill").style.width = Math.max(0, me.hp) + "%";
  $("hpBar").classList.toggle("low", me.hp < 30);
  $("boostFill").style.width = me.boost + "%";
  const g = curGun(me);
  if (me.reloadT > 0) setHTML("ammoBig", t("reloading"));
  else if (g) setHTML("ammoBig", g.mag + " <small>/ " + me.ammo[WEAPONS[g.type].ammo] + "</small>");
  else setHTML("ammoBig", "");
  for (const i of [0, 1, 2]) {
    const el = $("slot" + i), sg = i < 2 ? me.slots[i] : null;
    const label = i === 2 ? t("fists") : sg ? t(sg.type) : t("empty");
    const sub = i === 2 ? "3" : sg ? (i + 1) + " · " + sg.mag + "/" + me.ammo[WEAPONS[sg.type].ammo] : String(i + 1);
    setHTML("slot" + i, label + "<small>" + sub + "</small>");
    el.classList.toggle("on", me.cur === i);
    el.classList.toggle("empty", i < 2 && !sg);
  }
  ["bandage", "medkit", "soda"].forEach((it, i) => {
    setHTML("item-" + it, ITEM_ICON[it] + " " + me.items[it] + "<small>" + (isTouch ? t(it) : (i + 4) + " · " + t(it)) + "</small>");
    $("item-" + it).classList.toggle("zero", !me.items[it]);
    $("item-" + it).classList.toggle("using", !!(me.heal && me.heal.type === it));
  });
  const gl = me.alive ? nearestGunLoot(me) : null;
  $("prompt").hidden = !gl || isTouch;
  if (gl && !isTouch) setText("prompt", t("pick", { n: lootName(gl) }));
  $("tPick").hidden = !gl;
  if (gl) setText("tPick", t("pickT", { n: lootName(gl) }));
  $("vignette").style.opacity = me.alive ? Math.max(G.flash * 2, me.hp < 25 ? .5 + Math.sin(G.time * 6) * .2 : 0, outside ? .35 : 0) : 0;
  // kill feed
  const fresh = G.feed.filter(f => G.time - f.t < 6).slice(-5);
  const key = fresh.map(f => f.id).join(",");
  if (hudCache.feed !== key) {
    hudCache.feed = key;
    const feed = $("feed"); feed.innerHTML = "";
    for (const f of fresh) {
      const d = document.createElement("div"); d.className = "pill" + (f.mine ? " me" : ""); d.textContent = f.text; feed.appendChild(d);
    }
  }
}
function addFeed(victim, killer, wk) {
  let text;
  if (killer) text = killer.name + "  [" + t(wk === "boom" ? "boom" : wk) + "]  " + victim.name;
  else text = victim.name + "  —  " + t(wk === "zone" ? "zone" : "boom");
  G.feed.push({ id: nextId++, t: G.time, text, mine: victim === G.me || killer === G.me });
}

/* ---------- audio (procedural, no files) ---------- */
let AC = null, noiseBuf = null, sfxCount = 0;
function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * .6, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  } catch (e) { AC = null; }
}
const SFX = {
  shot: [1400, .1, .18, "bandpass"], shotgun: [700, .22, .3, "lowpass"], sniper: [500, .35, .4, "lowpass"],
  hit: [2600, .05, .12, "highpass"], punch: [380, .07, .18, "lowpass"], crate: [500, .18, .22, "lowpass"], boom: [140, .6, .7, "lowpass"]
};
function sfx(kind, x, y) {
  if (!AC || !G || G.attract || sfxCount > 10) return;
  const d = Math.hypot(x - G.cam.x, y - G.cam.y), vol = Math.max(0, 1 - d / 1400);
  if (vol < .03) return;
  sfxCount++;
  const now = AC.currentTime;
  try {
    if (kind === "pickup" || kind === "win") {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(kind === "win" ? 520 : 660, now); o.frequency.exponentialRampToValueAtTime(kind === "win" ? 1040 : 990, now + (kind === "win" ? .4 : .08));
      g.gain.setValueAtTime(.12, now); g.gain.exponentialRampToValueAtTime(.001, now + (kind === "win" ? .5 : .12));
      o.connect(g).connect(AC.destination); o.start(now); o.stop(now + .55); return;
    }
    const [f, dur, gain, type] = SFX[kind];
    const src = AC.createBufferSource(), flt = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = noiseBuf; flt.type = type; flt.frequency.value = f;
    g.gain.setValueAtTime(gain * vol, now); g.gain.exponentialRampToValueAtTime(.001, now + dur);
    src.connect(flt).connect(g).connect(AC.destination); src.start(now); src.stop(now + dur + .02);
  } catch (e) {}
}

/* ---------- input wiring ---------- */
addEventListener("keydown", e => {
  if (e.code === "Escape" || e.code === "KeyP") { if (G && !G.attract && !G.over) togglePause(); return; }
  keys.add(e.code);
  const me = G && G.me;
  if (!me || !me.alive || paused) return;
  if (e.code === "KeyR") startReload(me);
  else if (e.code === "KeyE" || e.code === "KeyF") { const l = nearestGunLoot(me); if (l) pickupLoot(me, l); }
  else if (e.code === "Digit1") switchWeapon(me, 0);
  else if (e.code === "Digit2") switchWeapon(me, 1);
  else if (e.code === "Digit3") switchWeapon(me, 2);
  else if (e.code === "KeyQ") switchWeapon(me, me.prevCur);
  else if (e.code === "Digit4" || e.code === "Digit7") startHeal(me, "bandage");
  else if (e.code === "Digit5" || e.code === "Digit8") startHeal(me, "medkit");
  else if (e.code === "Digit6" || e.code === "Digit9") startHeal(me, "soda");
});
addEventListener("keyup", e => keys.delete(e.code));
addEventListener("blur", () => { keys.clear(); mouse.down = false; if (G && !G.attract && !G.over && !paused) togglePause(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && G && !G.attract && !G.over && !paused) togglePause(); });
addEventListener("wheel", e => {
  const me = G && G.me; if (!me || !me.alive || paused) return;
  const order = [0, 1, 2].filter(i => i === 2 || me.slots[i]);
  const idx = order.indexOf(me.cur);
  switchWeapon(me, order[(idx + (e.deltaY > 0 ? 1 : -1) + order.length) % order.length]);
}, { passive: true });
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch") {
    if (!isTouch) { isTouch = true; document.body.classList.add("touch"); renderMenu(); for (const k in hudCache) delete hudCache[k]; }
    const st = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
    if (e.clientX < VW / 2) { if (!touch.move) touch.move = st; } else if (!touch.aim) touch.aim = st;
    e.preventDefault();
  } else {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (e.button === 0) mouse.down = true;
  }
  initAudio();
});
addEventListener("pointermove", e => {
  if (e.pointerType === "touch") {
    for (const st of [touch.move, touch.aim]) if (st && st.id === e.pointerId) {
      let dx = (e.clientX - st.ox) / 60, dy = (e.clientY - st.oy) / 60; const m = Math.hypot(dx, dy);
      if (m > 1) { dx /= m; dy /= m; }
      st.dx = dx; st.dy = dy;
    }
  } else { mouse.x = e.clientX; mouse.y = e.clientY; }
});
const endTouch = e => {
  if (touch.move && touch.move.id === e.pointerId) touch.move = null;
  if (touch.aim && touch.aim.id === e.pointerId) touch.aim = null;
  if (e.pointerType !== "touch" && e.button === 0) mouse.down = false;
};
addEventListener("pointerup", endTouch);
addEventListener("pointercancel", endTouch);
$("tPick").addEventListener("pointerdown", e => { e.stopPropagation(); const me = G.me; if (me && me.alive) { const l = nearestGunLoot(me); if (l) pickupLoot(me, l); } });
$("tReload").addEventListener("pointerdown", e => { e.stopPropagation(); if (G.me && G.me.alive) startReload(G.me); });
$("tSwap").addEventListener("pointerdown", e => {
  e.stopPropagation(); const me = G.me; if (!me || !me.alive) return;
  const order = [0, 1, 2].filter(i => i === 2 || me.slots[i]);
  switchWeapon(me, order[(order.indexOf(me.cur) + 1) % order.length]);
});

function togglePause() {
  paused = !paused;
  $("pause").hidden = !paused;
  keys.clear(); mouse.down = false; touch.move = touch.aim = null;
}
$("pauseBtn").addEventListener("click", togglePause);
$("resumeBtn").addEventListener("click", togglePause);
$("quitBtn").addEventListener("click", toMenu);
$("againBtn").addEventListener("click", startMatch);
$("endMenuBtn").addEventListener("click", toMenu);
$("playBtn").addEventListener("click", startMatch);

/* ---------- menu ---------- */
function renderMenu() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("diffs").setAttribute("aria-label", t("difficulty"));
  const diffs = $("diffs"); diffs.innerHTML = "";
  for (const d of DIFFS) {
    const b = document.createElement("button"); b.className = "btn"; b.textContent = t(d);
    b.setAttribute("aria-pressed", settings.diff === d);
    b.addEventListener("click", () => { settings.diff = d; saveSettings(); renderMenu(); });
    diffs.appendChild(b);
  }
  $("diffDesc").textContent = t(settings.diff + "D");
  $("botCount").value = settings.bots; $("botOut").textContent = settings.bots;
  $("helpTxt").innerHTML = isTouch ? t("helpTouch") : t("helpPc");
  let best = null; try { best = JSON.parse(localStorage.getItem("lastring-best") || "null"); } catch (e) {}
  $("bestTxt").textContent = best ? t("best", { p: best.p, k: best.k }) : "";
}
function saveSettings() { try { localStorage.setItem("lastring-settings", JSON.stringify(settings)); } catch (e) {} }
$("botCount").addEventListener("input", e => { settings.bots = +e.target.value; $("botOut").textContent = settings.bots; saveSettings(); });
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lastring-lang", lang); } catch (e) {}
  renderMenu();
}));

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  sfxCount = 0;
  if (G && !paused) update(dt);
  if (G) { render(); updateHUD(); }
  requestAnimationFrame(frame);
}
if (matchMedia("(pointer: coarse)").matches) { isTouch = true; document.body.classList.add("touch"); }
resize();
newGame(true);
renderMenu();
requestAnimationFrame(frame);
window.__lastRing = { get G() { return G; }, update, startMatch };
</script>
