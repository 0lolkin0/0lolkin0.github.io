<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Последнее кольцо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: полноэкранный canvas с картой, поверх — HUD (DOM) и мультяшные карточки меню/паузы/итогов */
:root {
  --ink: #23264a;
  --grass: #7cc36a;
  --sun: #ffd45c;
  --red: #ff5a5f;
  --blue: #5fb8f0;
  --white: #ffffff;
  --display: "Rubik", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --outline: 3px solid var(--ink);
  --shadow: 5px 5px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #4f8f45; color: var(--ink); font-family: var(--body); }
body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
canvas#game { position: fixed; inset: 0; display: block; touch-action: none; cursor: crosshair; }

.btn {
  font-family: var(--display); font-weight: 700; font-size: 1rem;
  color: var(--ink); background: var(--white);
  border: var(--outline); border-radius: 14px; padding: 8px 16px;
  box-shadow: 3px 3px 0 var(--ink); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn[aria-pressed="true"] { background: var(--sun); }
.btn:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
.btn.big { font-size: 1.35rem; padding: 12px 28px; background: var(--red); color: var(--white); text-shadow: 2px 2px 0 var(--ink); }

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 10; display: flex; overflow-y: auto;
  background: rgba(35, 38, 74, .35);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
}
.card {
  background: var(--white); border: var(--outline); border-radius: 24px; box-shadow: var(--shadow);
  padding: 22px 24px; text-align: center; width: min(460px, 100%); margin: auto;
  display: flex; flex-direction: column; gap: 14px; align-items: center;
  animation: bounce .45s cubic-bezier(.3, 1.6, .5, 1);
}
@keyframes bounce { from { transform: scale(.5) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
h1 {
  font-family: var(--display); font-weight: 900; margin: 0;
  font-size: clamp(2.1rem, 9vw, 3.2rem); line-height: 1; text-wrap: balance;
  color: var(--sun); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  text-shadow: 4px 4px 0 var(--ink); transform: rotate(-2deg);
}
.card h2 { font-family: var(--display); font-weight: 900; font-size: 2rem; margin: 0; }
.tagline { margin: -4px 0 0; font-weight: 800; }
.langs { display: flex; gap: 6px; align-self: flex-end; }
.langs .btn { font-size: .8rem; padding: 3px 9px; border-radius: 10px; }
.label { font-family: var(--display); font-weight: 700; margin: 0; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.row .btn { font-size: .9rem; padding: 6px 12px; }
.desc { margin: -6px 0 0; font-weight: 600; font-size: .92rem; min-height: 2.6em; line-height: 1.3; }
.slider { display: flex; align-items: center; gap: 10px; width: 100%; font-weight: 800; }
.slider input { flex: 1; accent-color: var(--red); }
.slider output { font-family: var(--display); min-width: 2ch; }
.help { margin: 0; font-size: .85rem; font-weight: 600; line-height: 1.45; color: #4a4e75; }
.help b { color: var(--ink); }
.best { margin: 0; font-weight: 800; font-size: .9rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.stat { background: #f4f1e6; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 4px; }
.stat b { display: block; font-family: var(--display); font-size: 1.5rem; }
.stat span { font-size: .78rem; font-weight: 800; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; font-family: var(--display); }
#hud button { pointer-events: auto; }
.pill {
  background: rgba(35, 38, 74, .78); color: var(--white); border-radius: 12px;
  padding: 4px 10px; font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums;
}
.tl { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.tl .line { display: flex; gap: 6px; }
#zoneMsg { font-size: .85rem; }
#zoneMsg.warn { background: rgba(200, 30, 40, .85); }
#mini {
  position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  width: 150px; height: 150px; border: 3px solid var(--ink); border-radius: 14px; background: #4f8f45;
}
#pauseBtn { position: absolute; top: calc(max(10px, env(safe-area-inset-top, 0px)) + 160px); right: max(10px, env(safe-area-inset-right, 0px)); padding: 4px 12px; font-size: .9rem; }
#feed { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; align-items: center; width: min(420px, 50vw); }
#feed .pill { font-family: var(--body); font-weight: 800; font-size: .82rem; text-align: center; animation: fadein .2s; }
#feed .me { color: var(--sun); }
@keyframes fadein { from { opacity: 0; transform: translateY(-6px); } }
.bottom {
  position: absolute; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center; align-items: flex-end; gap: 14px; padding: 0 10px; flex-wrap: wrap;
}
.vitals { display: flex; flex-direction: column; align-items: center; gap: 4px; width: min(340px, 80vw); }
#ammoBig { color: var(--white); font-weight: 900; font-size: 1.6rem; text-shadow: 2px 2px 0 var(--ink); font-variant-numeric: tabular-nums; }
#ammoBig small { font-size: .9rem; opacity: .9; }
.bar { width: 100%; height: 14px; background: rgba(35, 38, 74, .7); border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.bar.boost { height: 7px; border-width: 1.5px; }
.bar i { display: block; height: 100%; width: 100%; background: #fff; transition: width .15s; }
.bar.boost i { background: #ffb33d; }
.bar.boost { position: relative; height: 9px; }
.bar.boost::after {
  /* thresholds where boost heals faster and speeds you up: 25 / 50 / 87 */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent calc(25% - 1px), var(--ink) calc(25% - 1px) 25%, transparent 25% calc(50% - 1px), var(--ink) calc(50% - 1px) 50%, transparent 50% calc(87% - 1px), var(--ink) calc(87% - 1px) 87%, transparent 87%);
}
#boostTxt { font-size: .75rem; padding: 2px 8px; background: rgba(255, 179, 61, .9); color: var(--ink); }
.slot span, .item span, .eq span, .am span { white-space: nowrap; }
.bottom { flex-wrap: nowrap; }
.side { min-width: 0; flex: 0 1 auto; }
.bar.low i { background: var(--red); }
.slots, .items, .equip, .ammo { display: flex; gap: 6px; }
.side { display: flex; flex-direction: column; gap: 6px; }
.side.left { align-items: flex-start; }
.side.right { align-items: flex-end; }
.eq {
  display: flex; align-items: center; gap: 4px; background: rgba(35, 38, 74, .72); color: var(--white);
  border: 2px solid var(--ink); border-radius: 12px; padding: 2px 8px 2px 3px; font-weight: 700; font-size: .78rem; line-height: 1.1;
}
.eq canvas { width: 30px; height: 30px; }
.eq small { display: block; font-size: .66rem; opacity: .75; font-weight: 500; }
.eq.none { opacity: .45; }
button.eq { font-family: var(--display); text-align: left; }
.eq.l1 { border-color: #d9dde3; } .eq.l2 { border-color: #5fb8f0; } .eq.l3 { border-color: #ffd45c; box-shadow: 0 0 0 2px var(--ink); }
.ammo { background: rgba(35, 38, 74, .72); border: 2px solid var(--ink); border-radius: 12px; padding: 3px 6px; gap: 8px; }
.am { display: flex; align-items: center; gap: 4px; color: var(--white); font-weight: 700; font-size: .78rem; font-variant-numeric: tabular-nums; line-height: 1; }
.am i { display: inline-block; width: 7px; height: 16px; border-radius: 4px 4px 1px 1px; border: 1.5px solid var(--ink); }
.am small { font-size: .62rem; opacity: .7; font-weight: 500; display: block; }
.am.zero { opacity: .35; }
.am.cur { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 6px; }
.slot { display: flex; align-items: center; gap: 6px; }
.slot canvas { width: 54px; height: 24px; flex: none; }
.slot, .item {
  background: rgba(35, 38, 74, .72); color: var(--white); border: 2px solid var(--ink); border-radius: 12px;
  padding: 4px 8px; font-family: var(--display); font-weight: 700; font-size: .8rem; text-align: left;
  min-width: 64px; cursor: pointer; line-height: 1.15;
}
.slot small, .item small { display: block; font-size: .7rem; opacity: .75; font-weight: 500; }
.slot.on { background: var(--sun); color: var(--ink); }
.slot.empty { opacity: .45; }
.item { min-width: 50px; display: flex; align-items: center; gap: 3px; }
.item canvas { width: 22px; height: 22px; flex: none; }
.item.zero { opacity: .4; }
.item.using { background: #ffb33d; color: var(--ink); }
#mini { pointer-events: auto; cursor: pointer; }
#bigmap {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(86vh, 92vw); height: min(86vh, 92vw); border: 4px solid var(--ink); border-radius: 18px;
  box-shadow: var(--shadow); background: #4f8f45; pointer-events: auto; cursor: pointer; z-index: 3;
}
#toast { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); font-size: 1.1rem; }
#testPanel {
  position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 96px; width: 230px; max-height: calc(100vh - 230px); overflow-y: auto;
  pointer-events: auto; background: rgba(255, 255, 255, .95); border: var(--outline); border-radius: 16px; box-shadow: var(--shadow);
  padding: 10px; display: flex; flex-direction: column; gap: 6px; font-family: var(--body); font-weight: 800; font-size: .82rem;
}
#testPanel h3 { margin: 0; font-family: var(--display); font-size: 1rem; }
#testPanel label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
#testPanel .btn { font-size: .78rem; padding: 4px 8px; border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); }
#testPanel .grid2 { display: flex; flex-wrap: wrap; gap: 5px; }
#testPanel select { font: inherit; border: 2px solid var(--ink); border-radius: 8px; padding: 2px 4px; }
#testPanel p { margin: 0; font-weight: 600; font-size: .74rem; color: #4a4e75; }
#testBtn { position: absolute; top: calc(max(10px, env(safe-area-inset-top, 0px)) + 160px); right: calc(max(10px, env(safe-area-inset-right, 0px)) + 56px); padding: 4px 10px; font-size: .9rem; }
body.touch #testBtn { top: calc(max(10px, env(safe-area-inset-top, 0px)) + 120px); }
.btn.alt { font-size: .95rem; padding: 6px 16px; }
.card.wide { width: min(1040px, 100%); align-items: stretch; }
.card.wide h2 { text-align: center; }
.tablewrap { overflow-x: auto; border: 2px solid var(--ink); border-radius: 14px; }
.wtable { border-collapse: collapse; width: 100%; font-size: .82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wtable th, .wtable td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #e3e0d4; }
.wtable th { font-family: var(--display); font-weight: 700; background: #f4f1e6; position: sticky; top: 0; text-align: right; }
.wtable th:first-child, .wtable td:first-child { text-align: left; position: sticky; left: 0; background: var(--white); }
.wtable th:first-child { background: #f4f1e6; }
.wtable td:first-child { font-family: var(--display); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.wtable td:first-child canvas { width: 48px; height: 22px; }
.wtable .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink); margin-right: 4px; }
.wtable tr:last-child td { border-bottom: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.adm { display: flex; flex-direction: column; gap: 14px; text-align: left; font-size: .85rem; font-weight: 700; }
.adm h3 { margin: 0 0 6px; font-family: var(--display); font-size: 1rem; }
.adm input[type=number] { width: 72px; font: inherit; font-weight: 700; border: 2px solid var(--ink); border-radius: 8px; padding: 2px 4px; }
.adm input[type=range] { flex: 1; accent-color: var(--red); }
.adm .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 14px; }
.adm .fields label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.adm .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.adm .group { border: 2px solid var(--ink); border-radius: 12px; padding: 8px 10px; background: #fbfaf5; }
.adm .group label { display: grid; grid-template-columns: 1fr 72px 48px; align-items: center; gap: 6px; margin: 3px 0; }
.adm .group .pct { text-align: right; color: #4a4e75; font-variant-numeric: tabular-nums; }
.adm .wtable input[type=number] { width: 64px; }
.adm .wtable td, .adm .wtable th { padding: 4px 6px; }
.adm .hint { margin: 0; font-weight: 600; font-size: .78rem; color: #4a4e75; }
.adm .slider { font-weight: 800; }
.wnote { margin: 0; font-size: .8rem; font-weight: 600; color: #4a4e75; text-align: left; }
#prompt { position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%); font-weight: 700; }
#vignette { position: absolute; inset: 0; box-shadow: inset 0 0 120px 30px rgba(255, 30, 40, .55); opacity: 0; transition: opacity .25s; }
.touchbtns { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 190px; display: none; flex-direction: column; gap: 10px; }
.touchbtns .btn { pointer-events: auto; font-size: .85rem; padding: 8px 12px; }
body.touch .touchbtns { display: flex; }
body.touch #prompt { bottom: auto; top: 46%; }
body.touch .bottom { justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px; }
body.touch .slots, body.touch .items { gap: 4px; }
body.touch .slot, body.touch .item { min-width: 0; padding: 3px 7px; font-size: .72rem; }
body.touch .slot canvas { width: 36px; height: 16px; }
body.touch .eq canvas { width: 22px; height: 22px; }
body.touch .eq small, body.touch .am small { display: none; }
body.touch .side.left, body.touch .side.right { gap: 4px; }
body.touch .item small { display: none; }
body.touch #ammoBig { font-size: 1.2rem; }
body.touch .vitals { order: -1; width: 100%; }
body.touch #mini { width: 110px; height: 110px; }
body.touch #pauseBtn { top: calc(max(10px, env(safe-area-inset-top, 0px)) + 120px); }
@media (max-width: 1180px) {
  .bottom { flex-wrap: wrap; justify-content: space-between; align-items: flex-end; }
  .vitals { order: -1; flex: 0 0 100%; }
  .vitals .bar { max-width: 520px; }
}
@media (max-width: 640px) {
  .slot, .item { min-width: 0; font-size: .72rem; padding: 3px 6px; }
  #feed { top: calc(max(10px, env(safe-area-inset-top, 0px)) + 64px); left: 10px; transform: none; align-items: flex-start; width: 60vw; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div id="vignette"></div>
  <div class="tl">
    <div class="line"><div class="pill" id="aliveTxt"></div><div class="pill" id="killsTxt"></div></div>
    <div class="pill" id="zoneMsg"></div>
  </div>
  <div id="feed" aria-live="polite"></div>
  <canvas id="mini" width="150" height="150"></canvas>
  <button class="btn" id="pauseBtn" aria-label="Пауза" data-i18n-aria="pause">II</button>
  <div class="pill" id="prompt" hidden></div>
  <div class="pill" id="toast" hidden></div>
  <canvas id="bigmap" hidden></canvas>
  <button class="btn" id="testBtn" hidden>🧪</button>
  <div id="testPanel" hidden></div>
  <div class="touchbtns">
    <button class="btn" id="tPick" hidden></button>
    <button class="btn" id="tReload" data-i18n="reload">Перезарядка</button>
    <button class="btn" id="tSwap" data-i18n="swap">Сменить</button>
  </div>
  <div class="bottom">
    <div class="side left">
      <div class="equip" id="equip"></div>
      <div class="items" id="items"></div>
    </div>
    <div class="vitals">
      <div id="ammoBig"></div>
      <div class="pill" id="boostTxt" hidden></div>
      <div class="bar boost"><i id="boostFill"></i></div>
      <div class="bar" id="hpBar"><i id="hpFill"></i></div>
    </div>
    <div class="side right">
      <div class="ammo" id="ammoList"></div>
      <div class="slots" id="slots"></div>
    </div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <div class="langs" role="group" aria-label="Язык" data-i18n-aria="language">
      <button class="btn" data-lang="ru" aria-pressed="true">RU</button>
      <button class="btn" data-lang="tr" aria-pressed="false">TR</button>
      <button class="btn" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <h1 data-i18n="title">Последнее кольцо</h1>
    <p class="tagline" data-i18n="tagline">Собирай лут, прячься в кустах и останься последним в сужающемся кольце</p>
    <p class="label" data-i18n="difficulty">Сложность ботов</p>
    <div class="row" id="diffs" role="group"></div>
    <p class="desc" id="diffDesc"></p>
    <label class="slider"><span data-i18n="bots">Ботов</span><input type="range" id="botCount" min="3" max="40" step="1" value="20"><output id="botOut">20</output></label>
    <button class="btn big" id="playBtn" data-i18n="play">Играть!</button>
    <div class="row">
      <button class="btn alt" id="testModeBtn" data-i18n="test">🧪 Тестовый режим</button>
      <button class="btn alt" id="weaponsBtn" data-i18n="wBtn">📋 Оружие</button>
      <button class="btn alt adminBtn" id="adminBtn" hidden>⚙️ Админ</button>
    </div>
    <p class="best" id="bestTxt"></p>
    <p class="help" id="helpTxt"></p>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="card">
    <h2 data-i18n="paused">Пауза</h2>
    <button class="btn big" id="resumeBtn" data-i18n="resume">Продолжить</button>
    <button class="btn" id="weaponsBtn2" data-i18n="wBtn">📋 Оружие</button>
    <button class="btn adminBtn" id="adminBtn2" hidden>⚙️ Админ</button>
    <button class="btn" id="quitBtn" data-i18n="toMenu">В меню</button>
  </div>
</div>

<div class="overlay" id="weaponsOv" hidden>
  <div class="card wide">
    <h2 data-i18n="wTitle">Характеристики оружия</h2>
    <div class="tablewrap"><table class="wtable" id="wtable"></table></div>
    <p class="wnote" data-i18n="wNote"></p>
    <button class="btn" id="weaponsClose" data-i18n="close" style="align-self: center">Закрыть</button>
  </div>
</div>

<div class="overlay" id="adminOv" hidden>
  <div class="card wide">
    <h2>⚙️ Админ-панель</h2>
    <div class="tabs" id="adminTabs"></div>
    <div class="adm" id="adminBody"></div>
    <div class="row">
      <button class="btn" id="adminExport">📋 Скопировать настройки</button>
      <button class="btn" id="adminImport">📥 Вставить настройки</button>
      <button class="btn" id="adminReset">↺ Сбросить всё</button>
      <button class="btn" id="adminClose">Закрыть</button>
    </div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <h2 id="endTitle"></h2>
    <p class="tagline" id="endSub"></p>
    <div class="stats">
      <div class="stat"><b id="sPlace"></b><span data-i18n="place">Место</span></div>
      <div class="stat"><b id="sKills"></b><span data-i18n="killsW">Убийства</span></div>
      <div class="stat"><b id="sTime"></b><span data-i18n="timeW">Время</span></div>
    </div>
    <button class="btn big" id="againBtn" data-i18n="again">Ещё раз</button>
    <button class="btn" id="endMenuBtn" data-i18n="toMenu">В меню</button>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   Последнее кольцо — 2D королевская битва с ботами.
   Полностью собственный код: карта, лут, сужающаяся зона, ИИ ботов.
   ===================================================================== */

/* ---------- i18n ---------- */
const I18N = {

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const turnToward = (a, b, max) => { const d = angDiff(a, b); return Math.abs(d) <= max ? b : a + Math.sign(d) * max; };
function weighted(table) {
  let sum = 0; for (const k in table) sum += table[k];
  let r = Math.random() * sum;
  for (const k in table) { r -= table[k]; if (r <= 0) return k; }
  return Object.keys(table)[0];
}
const fmtTime = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  G.floors.push({ x: cx, y: cy, hw: W / 2, hh: H / 2 });

  if (type === 0) {

/* =====================================================================

   Each bot has a personality (rusher / balanced / looter / camper) and a

   A* over a navigation grid, hear gunshots, take cover to heal and reload,
   stop to shoot with guns that are inaccurate on the move, glance around,
   loot buildings early, crack the M249 case and give up unreachable goals.

   the behaviour below sets how human they look.

  if (!attract) {

    G.me.color = "#ffd45c";
    G.players.push(G.me);
  }
  for (let i = 0; i < n; i++) {

    const lvl = attract ? pick(["easy", "normal", "hard"]) : settings.diff === "mixed" ? pick(["easy", "normal", "normal", "hard", "insane"]) : settings.diff;
    G.players.push(makePlayer(names[i % names.length] + (i >= names.length ? i : ""), true, s.x, s.y, makeSkill(lvl)));

}

    $("endSub").textContent = win ? t("winSub") : me.killer ? t("loseBy", { n: me.killer.name }) : wk === "zone" ? t("loseZone") : t("loseBoom");

  row(Object.keys(WEAPONS).filter(w => w !== "fists").map(w => ["gun", w, 1, { mag: WEAPONS[w].mag }]), -270, 74);
  row(AMMO_TYPES.flatMap(a => [["ammo", a, AMMO_PACK[a] * 3], ["ammo", a, AMMO_PACK[a] * 3]]), -185, 54);
  row(GEAR.flatMap(g => [1, 2, 3].map(l => [g, String(l), 1])), 185, 58);
  row(ITEM_KEYS.flatMap(it => [["heal", it, 1], ["heal", it, 1], ["heal", it, 1]]), 265, 46);

}
function testSpawn(kind) {

    const b = makePlayer(kind === "bot" ? t(lvl) + " #" + G.test.n : "🎯 #" + G.test.n, true, x, y, makeSkill(lvl));

      const gun = pick(["m4", "ak", "shotgun", "spas", "smg", "fiveseven"]);
      b.slots[0] = { type: gun, mag: WEAPONS[gun].mag }; b.ammo[WEAPONS[gun].ammo] = 90; b.cur = 0;

}

/* ---------- weapon stats table (computed from WEAPONS, so it always matches the game) ---------- */
function erf(x) {
  const t1 = 1 / (1 + .3275911 * Math.abs(x));
  const y = 1 - (((((1.061405429 * t1 - 1.453152027) * t1) + 1.421413741) * t1 - .284496736) * t1 + .254829592) * t1 * Math.exp(-x * x);
  return x >= 0 ? y : -y;
}
function hitChance(w, dist) {
  if (w.range < dist) return 0;
  const sd = w.spread * .6, half = Math.atan(24 / dist); // bullets spread as N(0, spread·0.6); target radius 24
  return erf(half / (sd * Math.SQRT2));
}
function rarityOf(type) {
  const ws = GUN_WEIGHTS.ground, total = Object.values(ws).reduce((a, b) => a + b, 0), share = (ws[type] || 0) / total;
  if (!share) return t("rVault");
  return share > .18 ? t("rCommon") : share > .09 ? t("rNormal") : share > .04 ? t("rRare") : t("rVeryRare");
}
function renderWeaponTable() {
  const cols = ["wName", "wAmmo", "wDmg", "wRate", "wDps", "wMag", "wReload", "wSpread", "wHit", "wRange", "wSpeed", "wAP", "wMove", "wFireMove", "wRarity"];
  const tb = $("wtable"); tb.innerHTML = "";
  const head = document.createElement("tr");
  for (const c of cols) { const th = document.createElement("th"); th.textContent = t(c); head.appendChild(th); }
  tb.appendChild(head);
  for (const type of Object.keys(WEAPONS)) {
    const w = WEAPONS[type], tr = document.createElement("tr");
    const cell = (html) => { const td = document.createElement("td"); td.innerHTML = html; tr.appendChild(td); return td; };
    const first = cell("");
    const cv = iconCanvas(48, 22);
    if (w.melee) paintIcon(cv, 48, 22, c => { c.fillStyle = "#f3c89a"; c.strokeStyle = INK; c.lineWidth = 1.5; for (const dx of [16, 32]) { c.beginPath(); c.arc(dx, 11, 7, 0, 7); c.fill(); c.stroke(); } });
    else paintIcon(cv, 48, 22, c => drawGunIcon(c, type, 24, 12, 44));
    first.append(cv, document.createTextNode(t(type)));
    if (w.melee) {
      cell("—"); cell(String(w.dmg)); cell((1 / w.rate).toFixed(1)); cell(String(Math.round(w.dmg / w.rate)));
      cell("—"); cell("—"); cell("—"); cell("—"); cell(t("melee")); cell("—"); cell("—");
    } else {
      cell('<span class="dot" style="background:' + AMMO_COLOR[w.ammo] + '"></span>' + t(w.ammo));
      cell(w.pellets > 1 ? w.dmg + " × " + w.pellets : String(w.dmg));
      cell((1 / w.rate).toFixed(1));
      cell(String(Math.round(w.dmg * w.pellets / w.rate)));
      cell(String(w.mag));
      cell(w.shell ? t("perShell", { n: w.shell }) : w.reload + " " + (lang === "en" ? "s" : lang === "tr" ? "sn" : "с"));
      cell("±" + (w.spread * .6 * 180 / Math.PI).toFixed(1) + "° / " + (w.moveSpread * .6 * 180 / Math.PI).toFixed(1) + "°");
      cell(Math.round(hitChance(w, 300) * 100) + "%");
      cell(String(w.range));
      cell(String(w.speed));
      cell(AMMO_AP[w.ammo] ? Math.round(AMMO_AP[w.ammo] * 100) + "%" : "—");
    }
    cell(Math.round(w.move * 100) + "%");
    cell(w.fireMove ? Math.round(w.move * w.fireMove * 100) + "%" : "—");
    cell(w.melee ? "—" : rarityOf(type));
    tb.appendChild(tr);

}

/* ---------- main update ---------- */
let paused = false;
function update(dt) {
  G.time += dt;
  G.navBudget = 3;
  if (G.sounds.length && G.time - G.sounds[0].t > 2) G.sounds = G.sounds.filter(s => G.time - s.t < 2);
  updateZone(dt);
  for (const p of G.players) {
    if (!p.alive) continue;
    if (p.isBot) botUpdate(p, dt); else humanInput(p, dt);
    updatePlayer(p, dt);
  }
  separatePlayers();
  updateBullets(dt);
  G.flash = Math.max(0, G.flash - dt);
  if (G.test && !G.me.alive) { G.respawnT -= dt; if (G.respawnT <= 0) respawnMe(); }
  // camera
  let follow = G.me && G.me.alive ? G.me : G.spectate;
  if ((!follow || !follow.alive) && (G.attract || G.over)) {
    if (G.me && G.me.killer && G.me.killer.alive) follow = G.me.killer;
    else follow = G.players.find(p => p.alive) || null;
    G.spectate = follow;
  }
  if (follow) { const k = Math.min(1, dt * 8); G.cam.x += (follow.x - G.cam.x) * k; G.cam.y += (follow.y - G.cam.y) * k; }
  if (G.attract && G.restartT > 0) { G.restartT -= dt; if (G.restartT <= 0) newGame(true); }
}

  const ssp = document.createElement("span"); ssp.id = "eqTxt-scope";
  sb.append(scv, ssp); equip.appendChild(sb);
  sb.addEventListener("pointerdown", e => { e.stopPropagation(); if (G.me && G.me.alive) cycleScope(G.me); });
  const am = $("ammoList"); am.innerHTML = "";
  for (const a of AMMO_TYPES) {
    const d = document.createElement("div"); d.className = "am"; d.id = "am-" + a; d.title = t(a);
    const i = document.createElement("i"); i.style.background = AMMO_COLOR[a];
    const sp = document.createElement("span"); sp.id = "amTxt-" + a;
    d.append(i, sp); am.appendChild(d);
  }
  for (const k in hudCache) delete hudCache[k];
}
function updateHUD() {
  if ($("hud").hidden) return;
  const me = G.me, z = G.zone;
  const alive = G.players.filter(p => p.alive).length;
  setText("aliveTxt", t("alive", { n: alive }));
  setText("killsTxt", t("kills", { n: me.kills }));
  const outside = me.alive && Math.hypot(me.x - z.x, me.y - z.y) > z.r;
  setText("zoneMsg", G.test ? t("testHud") : outside ? t("outside") : z.stage === "wait" ? t("zoneWait", { t: fmtTime(z.t) }) : z.stage === "shrink" ? t("zoneShrink") : t("zoneFinal"));
  $("zoneMsg").classList.toggle("warn", outside || z.stage === "shrink");
  $("hpFill").style.width = Math.max(0, me.hp) + "%";
  $("hpBar").classList.toggle("low", me.hp < 30);
  $("boostFill").style.width = me.boost + "%";
  const g = curGun(me);
  if (me.reloadT > 0) setHTML("ammoBig", t("reloading"));
  else if (g) setHTML("ammoBig", g.mag + " <small>/ " + me.ammo[WEAPONS[g.type].ammo] + " · " + t(WEAPONS[g.type].ammo) + "</small>");
  else setHTML("ammoBig", "");
  for (const i of [0, 1, 2]) {
    const el = $("slot" + i), sg = i < 2 ? me.slots[i] : null;
    const type = i === 2 ? "fists" : sg ? sg.type : "";
    if (hudCache["icon" + i] !== type) {
      hudCache["icon" + i] = type;
      paintIcon($("slotIcon" + i), 54, 24, c => { if (type && type !== "fists") drawGunIcon(c, type, 27, 13, 50); else if (type === "fists") { c.fillStyle = "#f3c89a"; c.strokeStyle = INK; c.lineWidth = 1.5; for (const dx of [18, 34]) { c.beginPath(); c.arc(dx, 12, 7, 0, 7); c.fill(); c.stroke(); } } });
    }
    const label = i === 2 ? t("fists") : sg ? t(sg.type) : t("empty");
    const sub = i === 2 ? "3" : sg ? (i + 1) + " · " + sg.mag + "/" + me.ammo[WEAPONS[sg.type].ammo] : String(i + 1);
    setHTML("slotTxt" + i, label + "<small>" + sub + "</small>");
    el.classList.toggle("on", me.cur === i);
    el.classList.toggle("empty", i < 2 && !sg);
  }
  ITEM_KEYS.forEach((it, i) => {
    setHTML("itemTxt-" + it, " " + me.items[it] + "/" + itemCap(me, it) + "<small>" + (i ? i + 4 : "B") + " · " + t(it) + "</small>");
    $("item-" + it).classList.toggle("zero", !me.items[it]);
    $("item-" + it).classList.toggle("using", !!(me.heal && me.heal.type === it));
  });
  for (const gk of GEAR) {
    const lv = me[gk];
    if (hudCache["eq" + gk] !== lv) { hudCache["eq" + gk] = lv; paintIcon($("eqIcon-" + gk), 30, 30, c => drawGearIcon(c, gk, lv, 15, 15, 26)); }
    setHTML("eqTxt-" + gk, t(gk + "S") + "<small>" + (lv ? t("lvl", { n: lv }) : t("none")) + "</small>");
    $("eq-" + gk).className = "eq " + (lv ? "l" + lv : "none");
  }
  const sc = activeScope(me);
  if (hudCache.scopeIcon !== sc) { hudCache.scopeIcon = sc; paintIcon($("eqIcon-scope"), 30, 30, c => drawScopeIcon(c, sc, 15, 15, 26)); }
  const indoor = me.alive && activeScope(me) !== me.scope;
  setHTML("eqTxt-scope", t("scopeS") + " " + activeScope(me) + "x<small>" + (indoor ? t("scopeIndoor") : me.scopes.map(n => n === me.scope ? "[" + n + "x]" : n + "x").join(" ") + " · Z") + "</small>");
  $("eq-scope").className = "eq " + (sc === 8 ? "l3" : sc === 4 ? "l2" : sc === 2 ? "l1" : "none");
  const bs = boostSpeed(me);
  $("boostTxt").hidden = bs <= 1;
  if (bs > 1) setText("boostTxt", t("speedUp", { n: Math.round((bs - 1) * 100) }));
  const curAmmo = g ? WEAPONS[g.type].ammo : null;
  for (const a of AMMO_TYPES) {
    setHTML("amTxt-" + a, me.ammo[a] + "<small>" + t(a) + "</small>");
    $("am-" + a).className = "am" + (me.ammo[a] ? "" : " zero") + (a === curAmmo ? " cur" : "");
  }
  const gl = me.alive ? nearestGunLoot(me) : null;
  $("prompt").hidden = !gl || isTouch;
  if (gl && !isTouch) setText("prompt", t("pick", { n: lootName(gl) }));
  $("tPick").hidden = !gl;
  if (gl) setText("tPick", t("pickT", { n: lootName(gl) }));
  $("vignette").style.opacity = me.alive ? Math.max(G.flash * 2, me.hp < 25 ? .5 + Math.sin(G.time * 6) * .2 : 0, outside ? .35 : 0) : 0;
  // kill feed
  const fresh = G.feed.filter(f => G.time - f.t < 6).slice(-5);
  const key = fresh.map(f => f.id).join(",");
  if (hudCache.feed !== key) {
    hudCache.feed = key;
    const feed = $("feed"); feed.innerHTML = "";
    for (const f of fresh) {
      const d = document.createElement("div"); d.className = "pill" + (f.mine ? " me" : ""); d.textContent = f.text; feed.appendChild(d);
    }
  }
}
function addFeed(victim, killer, wk) {
  let text;
  if (killer) text = killer.name + "  [" + t(wk === "boom" ? "boom" : wk) + "]  " + victim.name;
  else text = victim.name + "  —  " + t(wk === "zone" ? "zone" : "boom");
  G.feed.push({ id: nextId++, t: G.time, text, mine: victim === G.me || killer === G.me });
}

/* ---------- audio (procedural, no files) ---------- */
let AC = null, noiseBuf = null, sfxCount = 0;
function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * .6, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  } catch (e) { AC = null; }
}
const SFX = {
  shot: [1400, .1, .18, "bandpass"], ak: [900, .14, .24, "bandpass"], shell: [2200, .04, .1, "highpass"], shotgun: [700, .22, .3, "lowpass"], sniper: [500, .35, .4, "lowpass"],
  hit: [2600, .05, .12, "highpass"], headshot: [4200, .08, .2, "highpass"], punch: [380, .07, .18, "lowpass"], crate: [500, .18, .22, "lowpass"], boom: [140, .6, .7, "lowpass"]
};
function sfx(kind, x, y) {
  if (!AC || !G || G.attract || sfxCount > 10) return;
  const d = Math.hypot(x - G.cam.x, y - G.cam.y), vol = Math.max(0, 1 - d / 1400);
  if (vol < .03) return;
  sfxCount++;
  const now = AC.currentTime;
  try {
    if (kind === "pickup" || kind === "win") {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(kind === "win" ? 520 : 660, now); o.frequency.exponentialRampToValueAtTime(kind === "win" ? 1040 : 990, now + (kind === "win" ? .4 : .08));
      g.gain.setValueAtTime(.12, now); g.gain.exponentialRampToValueAtTime(.001, now + (kind === "win" ? .5 : .12));
      o.connect(g).connect(AC.destination); o.start(now); o.stop(now + .55); return;
    }
    const [f, dur, gain, type] = SFX[kind];
    const src = AC.createBufferSource(), flt = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = noiseBuf; flt.type = type; flt.frequency.value = f;
    g.gain.setValueAtTime(gain * vol, now); g.gain.exponentialRampToValueAtTime(.001, now + dur);
    src.connect(flt).connect(g).connect(AC.destination); src.start(now); src.stop(now + dur + .02);
  } catch (e) {}
}

/* ---------- input wiring ---------- */
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
  if (e.code === "Escape" || e.code === "KeyP") { if (G && !G.attract && !G.over) togglePause(); return; }
  keys.add(e.code);
  if (!G || G.attract || paused) return;
  if (e.code === "KeyG" && !e.repeat) { toggleBigMap(); return; }
  if (e.code === "KeyM" && !e.repeat) { cycleZoom(); return; }
  if (e.code === "KeyT" && !e.repeat) { toggleTestPanel(); return; }
  const me = G.me;
  if (!me || !me.alive || G.over) return;
  if (e.code === "Space" && !e.repeat) {
    // Space flips between the two gun slots (from fists it goes back to the last gun)
    const target = me.cur === 0 ? 1 : me.cur === 1 ? 0 : (me.prevCur !== 2 && me.slots[me.prevCur] ? me.prevCur : 0);
    if (me.slots[target]) switchWeapon(me, target);
    else if (me.cur === 2 && me.slots[1 - target]) switchWeapon(me, 1 - target);
    return;
  }
  if (e.code === "KeyR") startReload(me);
  else if (e.code === "Digit1") switchWeapon(me, 0);
  else if (e.code === "Digit2") switchWeapon(me, 1);
  else if (e.code === "Digit3") switchWeapon(me, 2);
  else if (e.code === "KeyQ") switchWeapon(me, me.prevCur);
  else if (e.code === "KeyB" || e.code === "Comma" || e.code === "Digit4") startHeal(me, "bandage");
  else if (e.code === "KeyZ" && !e.repeat) cycleScope(me);
  else if (e.code === "Digit5") startHeal(me, "medkit");
  else if (e.code === "Digit6") startHeal(me, "soda");
  else if (e.code === "Digit7") startHeal(me, "pills");
});
addEventListener("keyup", e => keys.delete(e.code));
addEventListener("blur", () => { keys.clear(); mouse.down = false; if (G && !G.attract && !G.over && !paused) togglePause(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && G && !G.attract && !G.over && !paused) togglePause(); });
addEventListener("wheel", e => {
  const me = G && G.me; if (!me || !me.alive || paused || G.over) return;
  const order = [0, 1, 2].filter(i => i === 2 || me.slots[i]);
  const idx = order.indexOf(me.cur);
  switchWeapon(me, order[(idx + (e.deltaY > 0 ? 1 : -1) + order.length) % order.length]);
}, { passive: true });
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch") {
    if (!isTouch) { isTouch = true; document.body.classList.add("touch"); renderMenu(); for (const k in hudCache) delete hudCache[k]; }
    const st = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
    if (e.clientX < VW / 2) { if (!touch.move) touch.move = st; } else if (!touch.aim) touch.aim = st;
    e.preventDefault();
  } else {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (e.button === 0) mouse.down = true;
    else if (e.button === 2) {
      // right click picks up the gun you are standing on
      const me = G && G.me;
      if (me && me.alive && !G.over && !paused) { const l = nearestGunLoot(me); if (l) pickupLoot(me, l); }
    }
  }
  initAudio();
});
addEventListener("pointermove", e => {
  if (e.pointerType === "touch") {
    for (const st of [touch.move, touch.aim]) if (st && st.id === e.pointerId) {
      let dx = (e.clientX - st.ox) / 60, dy = (e.clientY - st.oy) / 60; const m = Math.hypot(dx, dy);
      if (m > 1) { dx /= m; dy /= m; }
      st.dx = dx; st.dy = dy;
    }
  } else { mouse.x = e.clientX; mouse.y = e.clientY; }
});
const endTouch = e => {
  if (touch.move && touch.move.id === e.pointerId) touch.move = null;
  if (touch.aim && touch.aim.id === e.pointerId) touch.aim = null;
  if (e.pointerType !== "touch" && e.button === 0) mouse.down = false;
};
addEventListener("pointerup", endTouch);
addEventListener("pointercancel", endTouch);
$("tPick").addEventListener("pointerdown", e => { e.stopPropagation(); const me = G.me; if (me && me.alive) { const l = nearestGunLoot(me); if (l) pickupLoot(me, l); } });
$("tReload").addEventListener("pointerdown", e => { e.stopPropagation(); if (G.me && G.me.alive) startReload(G.me); });
$("tSwap").addEventListener("pointerdown", e => {
  e.stopPropagation(); const me = G.me; if (!me || !me.alive) return;
  const order = [0, 1, 2].filter(i => i === 2 || me.slots[i]);
  switchWeapon(me, order[(order.indexOf(me.cur) + 1) % order.length]);
});

function togglePause() {
  paused = !paused;
  $("pause").hidden = !paused;
  keys.clear(); mouse.down = false; touch.move = touch.aim = null;
}
$("pauseBtn").addEventListener("click", togglePause);
$("resumeBtn").addEventListener("click", togglePause);
$("quitBtn").addEventListener("click", toMenu);
$("againBtn").addEventListener("click", startMatch);
$("endMenuBtn").addEventListener("click", toMenu);
$("playBtn").addEventListener("click", startMatch);

/* ---------- menu ---------- */
function renderMenu() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("diffs").setAttribute("aria-label", t("difficulty"));
  const diffs = $("diffs"); diffs.innerHTML = "";
  for (const d of DIFFS) {
    const b = document.createElement("button"); b.className = "btn"; b.textContent = t(d);
    b.setAttribute("aria-pressed", settings.diff === d);
    b.addEventListener("click", () => { settings.diff = d; saveSettings(); renderMenu(); });
    diffs.appendChild(b);
  }
  $("diffDesc").textContent = t(settings.diff + "D");
  $("botCount").value = settings.bots; $("botOut").textContent = settings.bots;
  $("helpTxt").innerHTML = isTouch ? t("helpTouch") : t("helpPc");
  let best = null; try { best = JSON.parse(localStorage.getItem("lastring-best") || "null"); } catch (e) {}
  $("bestTxt").textContent = best ? t("best", { p: best.p, k: best.k }) : "";
}
function saveSettings() { try { localStorage.setItem("lastring-settings", JSON.stringify(settings)); } catch (e) {} }
$("botCount").addEventListener("input", e => { settings.bots = +e.target.value; $("botOut").textContent = settings.bots; saveSettings(); });
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lastring-lang", lang); } catch (e) {}
  renderMenu();
}));

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  sfxCount = 0;
  if (G && !paused) {
    let rem = dt * (G.test ? G.test.speed : 1);
    while (rem > 1e-4) { const d = Math.min(rem, .05); update(d); rem -= d; }
  }
  if (G) { render(); updateHUD(); }
  requestAnimationFrame(frame);
}
if (matchMedia("(pointer: coarse)").matches) { isTouch = true; document.body.classList.add("touch"); }
resize();
newGame(true);
renderMenu();
requestAnimationFrame(frame);
window.__lastRing = { get G() { return G; }, update, startMatch };
</script>
